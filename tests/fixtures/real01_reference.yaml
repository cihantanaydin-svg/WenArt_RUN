# Ground-truth reference for projects/real01/real01.pdf (page 1), reconciled from two independent readers
# (ref_reader1, ref_reader2). Every disagreement was settled against the PDF vector data with pdfplumber 0.11.10
# (27,259 lines, 9,592 curves, 26 rects, 163 chars), with 600 and 3000 dpi renders as a visual check.
# Scratch: /tmp/claude-0/-home-user-WenArt-RUN/e7de83a2-176e-5840-aa6f-eabfbcc7d4c5/scratchpad/ref_reconcile/
# PDF coordinates sit on a 0.12 pt grid, so measured positions are good to about +-0.01 ft. The tolerances below are
# acceptance limits for the pipeline, not how accurate the reference is.
#
# reconciliation:
#   C01 scale: R1 12.4352 pt/ft, R2 12.435 pt/ft. Same measurement: red arrow tip to tip 621.72 pt / 50 ft =
#       12.4344 and 373.08 pt / 30 ft = 12.4360. Difference is rounding only. Kept 12.4352 (the mean). The spec says
#       12.436; that is 0.005 % away.
#   C02 ids: the readers numbered doors, windows, openings, chairs and rooms differently. Kept R1's numbering for
#       D/W/O/F and R2's room ids (bed_nw / bed_sw are clearer than bed1 / bed2). Every element has an `aka:` with
#       both readers' ids. Not a geometry difference.
#   C03 door hinge + leaf: R1 hinges are 0.1-0.27 ft off with leaf 2.7/2.7/2.2/2.65/3.1; R2 hinges are at the arc
#       centres with leaf 2.85/2.85/2.37/2.85/3.32. PDF: a circle fitted to each swing Bezier (max residual
#       0.0004 ft) gives hinges (11.054,12.309) (11.112,11.710) (16.207,8.043) (41.722,13.852) (31.184,1.057) and
#       radii 2.852/2.852/2.369/2.852/3.324, so R2 is right. The drawn leaf rectangles are shorter
#       (2.605/2.605/2.162/2.605/3.040 ft), and R1's values fall between the two. Both are recorded:
#       swing_radius_ft (arc) and leaf_drawn_ft (rectangle). D5 differed most: 0.22 ft on leaf, 0.27 ft on hinge.
#   C04 door width: both readers agree on the rough opening (wall end to wall end). The PDF also shows frame
#       (rebate) symbols at both jambs, and the clear width between them is about 0.4 ft less. Added
#       clear_width_between_frames_ft. Tests use the rough opening, which matches the spec's arc rule radius = g +-12 %.
#   C05 dining chairs: R1 w 1.14 / d 1.44-1.46, R2 w 1.29 / d 1.50. PDF: the gold strokes plus the grey seat dots
#       per chair give 1.245-1.255 (across the front) x 1.457-1.461 (front to back). Used the PDF values. The 6
#       chair centres agree within 0.01 ft.
#   C06 sofa F14 depth: R1 2.31 (y 1.341-3.648), R2 2.20 (y 1.40-3.60). PDF: y 1.341-3.656, so 2.315. That is the
#       same block as F15 (2.306 x 6.224). Used 2.31.
#   C07 parking E-W extent (0.49 ft size difference): R1 to x 47.005 (15.50 ft), R2 to x 46.514 (15.01 ft). PDF:
#       for y < 8.753 the only line east of the parking is the plot boundary line x 47.005 (it runs y -3.001..27.001).
#       The plot-wall inner face line x 46.513 runs only y 8.753..26.499 and ends with a cap 46.513-47.005 at
#       y 8.753. So the drawn area reaches x 47.005. The printed 15'3" (15.25) matches neither face; it matches the
#       plot-wall centre line x 46.759 (15.252). Reference x1 = 47.005, and tests accept 46.46-47.06.
#       Parking also moves from rooms to site.areas: it is an exterior label (spec 2.7.2) and its outline is not
#       closed (no wall on the east, and open to the south setback below y 0).
#   C08 opening count: R2 has 6 openings (O6 = parking frontage), R1 has 5 (frontage under site). PDF: the
#       frontage is a gap in the plot wall, not in a house wall. Kept 5 house openings; the frontage is
#       site.plot_wall.frontage_opening.
#   C09 stair space type: R1 `stair`, R2 `hall`. The PDF has no label there. The schema has no `stair` room type,
#       and spec 2.7.1 says a face that holds a stair gets `hall`. Chose hall.
#   C10 stair hall / lobby split: both readers split at y 15.257. PDF: no wall, stub or separator line there. The
#       only line is the stair's first tread line (one of 8 tread lines y 15.257..21.085), and no free wall end is
#       near it (the runs x 11.006 and x 16.506 continue past it). Kept the two sub-spaces, but tests must also
#       accept a single hall face [11.252, 8.251, 16.26, 23.257] that holds the stair (see circulation.merged_face).
#   C11 round object F17 (type): R1 floor_lamp 0.55, R2 round_object with floor lamp 0.4. PDF at 3000 dpi: thin
#       outer circle, thick black annulus, white ring with 8 spokes, centre ring; 1.419 ft across at (26.263,3.276).
#       No text and no block name. Geometry agrees. The type stays uncertain: best guess floor_lamp at 0.45.
#   C12 telephone on F3: R1 (9.37,22.69), R2 (9.10,22.40), 0.40 ft apart. PDF: symbol x 8.897-9.669,
#       y 22.176-22.957, centre (9.28,22.57). Its 13 tiny rects form a keypad grid (all 26 rects on the page are the
#       keypads of the two phones), which supports "telephone" (confidence raised to 0.75). Same check on F5: (2.35,1.57).
#   C13 dining table rotation: R1 null, R2 0. The table is symmetric with its long axis N-S. In codebase terms:
#       size [4.06, 2.41] (width = longer side, spec 2.8), rotation_deg 90 modulo 180, front_deg null.
#   C14 rotation convention: both readers wrote the FRONT direction (CCW from +X) as `rotation_deg`. The codebase has
#       footprint.rotation_deg with an unrotated piece facing -Y, so front_deg = (270 + rotation_deg) mod 360
#       (wenart/synthetic/blocks.py). The reference gives front_deg (the readers' value) and rotation_deg (codebase)
#       separately.
#   C15 type names: the readers' names (double_bed, dining_table, dining_chair, sofa_3_seater/sofa_3_seat,
#       coffee_table, kitchen_counter_L, stair_dog_leg) are mapped to the schema enums (bed_double, table_dining,
#       chair, sofa, table_coffee, kitchen_counter, stair). The readers' names go in type_raw.
#   C16 kitchen counter: R1 has two legs (north 8.42 incl. corner, east 3.25 beyond it); R2 has one L polygon (east
#       leg 5.26 incl. corner). Same outline: PDF lines x 33.331-39.758 at y 21.249 and x 39.758 at y 17.997-21.249.
#       Spec 2.8 makes an L two pieces, with the corner square in the longer leg, so R1's split is used (F18a, F18b)
#       and the polygon is kept.
#   C17 plants: R1 west column x 43.665 (about 1.5 ft), R2 x 43.57 (1.4 ft). PDF: 9 identical clusters of 949 strokes,
#       each 1.462 x 1.391; west column x 43.654. Used the PDF values. Both readers count 9. The spec (2.10) says
#       "about 13 plants", but the PDF has 9.
#   C18 pooja window W9: R1 "window or ventilator (uncertain)", R2 window. PDF: same parallel-line symbol as the
#       other 8 windows, 1.997 ft wide. Type window; subtype stays uncertain.
#   C19 wall class of line x 30.755-31.507: R1 calls the piers interior_9in, R2 calls the whole line exterior. Same
#       rectangles (0.752 ft = 9 in). Thickness class 9in for the whole line; role exterior where it faces the
#       parking (W_ENT), interior for the piers P_1 and P_2.
#   C20 label anchors: the readers gave block centres. Spec 2.7.2 anchors a label at the centre of its name line.
#       Both are given (label_name_anchor_ft, label_block_centre_ft).
#   C21 stair-space bbox, lobby, beds, nightstands, sofas F15, coffee table, windows (9), doors (5, positions and
#       widths), walls, outline, plot, setbacks, planter strip, entrance step: the readers agree within 0.1 ft. Spot
#       checks against the vectors confirmed them; the values below are the vector values.
#   Spec notes (not reader differences, for the spec owner): plant count is 9, not about 13 (C17). Wall thickness
#       classes measure 0.150-0.153 m (6 in) and 0.226-0.229 m (9 in), not 0.165 / 0.235 m (milestone7.md 2.4).

reference_version: 1
source:
  file: projects/real01/real01.pdf
  page: 1
  page_size_pt: [842, 595]
  kind: AutoCAD 2018 vector PDF (via Ghostscript), imperial, no raster images, 163 text chars, no title, no north arrow
  wall_drawing: walls are dense 45-degree hatch (0.12 pt comb) bounded by axis-aligned black outline lines
  coordinate_quantum_pt: 0.12
  readers: [ref_reader1/real01_reference_reader1.yaml, ref_reader2/real01_reference_reader2.yaml]
frame:
  units: feet          # schema stores metres: 1 ft = 0.3048 m
  origin: min corner (outer face) of the HOUSE walls = PDF point (165.64, 459.84) in pdfplumber top-down coords
  axes: X right (plan east), Y up (plan north = page top; assumed, no north arrow drawn)
  conversion: "X_ft = (x_pt - 165.64) / 12.4352 ;  Y_ft = (459.84 - top_pt) / 12.4352"
conventions:
  bbox: "[x0, y0, x1, y1] in feet, world axes"
  size_wd_ft: "[width, depth] in the piece frame: width across the front, depth front to back; symmetric pieces: width = longer side"
  front_deg: direction the piece faces, CCW from +X (0 = +X east, 90 = +Y north, 180 = -X, 270 = -Y); null = no front
  rotation_deg: "codebase footprint.rotation_deg (unrotated piece faces -Y): rotation_deg = (front_deg + 90) mod 360"
  rotation_mod: angle period of the symbol (360 has a front, 180 = 2-fold symmetric, 90 = square, 0 = round/any)
  tol_keys:
    centre: max distance between centres (ft)
    edge: max error per bbox edge or wall face (ft)
    size: max error per side (ft), sides compared in the order given unless `size_unordered` is true
    width: max error of an opening width along its wall (ft)
    rot_deg: max angle error after reducing by rotation_mod
    area_rel: max relative area error
  ai_typed_rule: >
    For pieces whose type can only come from AI (no block names in this PDF), a test passes when the type is in
    type_accept, OR when type is `unknown` and status is `unverified` and both candidates are listed (spec 2.10).
    Type-checked deterministically (rule): stair, kitchen_counter.
tolerances_default:   # spec 2.10 limits converted to feet (0.15 m = 0.49 ft, 0.10 m = 0.33 ft)
  scale_rel: 0.002
  wall: {edge: 0.15, thickness: 0.10}
  outline: {vertex: 0.25, area_rel: 0.02}
  room: {edge: 0.30, centre: 0.50, area_rel: 0.05, label_anchor: 0.40}
  door: {centre: 0.49, width: 0.33, hinge: 0.25, swing_radius: 0.30}
  window: {centre: 0.49, width: 0.33}
  opening: {centre: 0.49, width: 0.33}
  furniture: {centre: 0.49, size: 0.49, rot_deg: 10}
  site_decor: {centre: 0.49, size: 0.49}
  recall_precision_min: {doors_windows: 0.9}

scale:
  pt_per_ft: 12.4352
  ft_per_pt: 0.080417
  m_per_pt: 0.024511
  how_measured: >
    Two red dimension lines (stroke rgb 1,0,0). "50'": arrow tips x 128.44 -> 750.16 pt = 621.72 pt -> 12.4344 pt/ft.
    "30'": tips top 124.08 -> 497.16 pt = 373.08 pt -> 12.4360 pt/ft. Mean 12.4352 (spread 0.013 %). Extension
    lines sit on the plot-wall OUTER faces, so 50' x 30' is the plot. Cross-checks: house 528.60 x 298.44 pt =
    42.508 x 24.000 ft; plot X = 0.5 + 2.5 + 42.5 + 4.0 + 0.5 = 50.0; all 8 room-size labels match within 0.2 %
    (parking, which is not a room, within 1.6 %).
  equivalent_ratio: about 1:69.5 (plotted to fit)
  tol: {rel: 0.002}

building_outline:
  description: L-shaped house, outer wall faces; the south-east notch is the parking (outside the house); entrance step not included
  polygon_ft: [[0.0, 0.0], [31.507, 0.0], [31.507, 8.753], [42.508, 8.753], [42.508, 24.0], [0.0, 24.0]]
  bbox_ft: [0.0, 0.0, 42.508, 24.0]
  size_ft: [42.508, 24.0]      # 42'6" x 24'0"
  area_sqft_gross: 923.9
  tol: {vertex: 0.25, area_rel: 0.02}

wall_thickness_classes:
  - {class: 9in, thickness_ft: 0.75, measured_ft: [0.743, 0.753], measured_m: [0.226, 0.229], tol: {thickness: 0.10}}
  - {class: 6in, thickness_ft: 0.50, measured_ft: [0.492, 0.502], measured_m: [0.150, 0.153], tol: {thickness: 0.10}}
  - {class: plot_6in, thickness_ft: 0.50, measured_ft: [0.493, 0.502], note: 'plot/compound wall, site only, never in building walls'}

counts:   # exact counts the tests should use
  doors: 5
  door_hinge_side_definition: seen from the side the door swings into, facing the door
  windows: 9
  windows_none_in: [bath, store, stair_hall, lobby]
  openings_house: 5            # O1-O5; the parking frontage is site.plot_wall.frontage_opening
  openings_required: [O1, O2, O3, O5]   # O4 only when the stair hall and lobby are split (C10)
  rooms_labelled: 8            # parking is a site area, not a room
  rooms_unlabelled_hall: [1, 2]   # 1 merged hall face or 2 (stair_hall + lobby), C10
  furniture_by_type:          # pieces inside the building (spec 2.10 list)
    bed_double: 2
    nightstand: 4
    table_dining: 1
    chair: 6
    sofa: 2
    table_coffee: 1
    round_piece_type_open: 1  # F17, floor_lamp best guess
    kitchen_counter: 2
    stair: 1
  furniture_total: 20
  rooms_without_furniture_in_documents: [bath, pooja, store, lobby]
  site_plants: 9
  site_other_decor: 1          # entrance step

walls:   # rect [x0, y0, x1, y1]; `openings` = ids of doors/windows/openings in that wall; runs = collinear pieces of one WallItem
  exterior_9in:
    - {id: W_N,   aka: [R1 N, R2 W_N],  rect: [0.0, 23.257, 42.508, 24.0],    openings: [W1, W6, W7], tol: {edge: 0.15, thickness: 0.10}}
    - {id: W_W,   aka: [R1 W, R2 W_W],  rect: [0.0, 0.0, 0.753, 24.0],        openings: [W3, W2],     tol: {edge: 0.15, thickness: 0.10}}
    - {id: W_S,   aka: [R1 S, R2 W_S],  rect: [0.0, 0.0, 31.507, 0.753],      openings: [W4, W5],     tol: {edge: 0.15, thickness: 0.10}}
    - {id: W_E,   aka: [R1 E, R2 W_E],  rect: [41.756, 8.753, 42.508, 24.0],  openings: [W8],         tol: {edge: 0.15, thickness: 0.10}}
    - {id: W_SE,  aka: [R1 SE_pooja_store, R2 W_SE], rect: [31.507, 8.753, 42.508, 9.505], openings: [W9], note: 'pooja/store south wall, faces parking', tol: {edge: 0.15, thickness: 0.10}}
    - {id: W_ENT, aka: [R1 E_drawing_to_parking, R2 W_ENT], rect: [30.755, 0.0, 31.507, 9.833], openings: [D5], note: 'drawing-room east wall, faces parking and entrance step', tol: {edge: 0.15, thickness: 0.10}}
  interior_9in:   # same axis line x 31.131 as W_ENT: run W_ENT + P_1 + P_2 with doorless gaps O5 (y 9.833-13.172) and O1 (y 16.0-21.249)
    - {id: P_1, aka: [R1 dining_kitchen_line part, R2 P_1], rect: [30.755, 13.172, 31.507, 16.0],   note: "pier: drawing/dining (W) | pooja-top/kitchen (E)", tol: {edge: 0.15, thickness: 0.10}}
    - {id: P_2, aka: [R1 dining_kitchen_line part, R2 P_2], rect: [30.755, 21.249, 31.507, 23.257], note: "stub from north wall: dining | kitchen", tol: {edge: 0.15, thickness: 0.10}}
  interior_6in:
    - {id: I_BED, aka: [R1 bed_partition, R2 I_BED], rect: [0.753, 11.754, 11.252, 12.256], note: bed_nw | bed_sw, tol: {edge: 0.15, thickness: 0.10}}
    - {id: I_SWB, aka: [R1 bed2_bath, R2 I_SWB],     rect: [10.76, 0.753, 11.252, 8.753],   note: "bed_sw | bath; run x 11.006 = I_SWB + end of I_BED + I_NWB with doors D2 (y 8.753-11.754) and D1 (y 12.256-15.257)", tol: {edge: 0.15, thickness: 0.10}}
    - {id: I_NWB, aka: [R1 bed1_stair, R2 I_NWB],    rect: [10.76, 15.257, 11.252, 23.257], note: bed_nw | stair hall, tol: {edge: 0.15, thickness: 0.10}}
    - {id: I_BTH, aka: [R1 bath_north_partial, R2 I_BTH], rect: [11.252, 7.749, 13.751, 8.251], note: "bath north stub; door D3 from its end (x 13.751) to I_BD (x 16.26)", tol: {edge: 0.15, thickness: 0.10}}
    - {id: I_BD,  aka: [R1 bath_east, R2 I_BD],      rect: [16.26, 0.753, 16.752, 8.753],   note: "bath | drawing; run x 16.506 = I_BD + I_SD with doorless gap O3 (y 8.753-14.755)", tol: {edge: 0.15, thickness: 0.10}}
    - {id: I_SD,  aka: [R1 stair_dining, R2 I_SD],   rect: [16.26, 14.755, 16.752, 23.257], note: stair hall | dining, tol: {edge: 0.15, thickness: 0.10}}
    - {id: I_DS,  aka: [R1 dining_south_partial, R2 I_DS], rect: [16.26, 14.755, 26.528, 15.257], note: "dining | drawing; FREE END at x 26.528 (separator O2 to P_1)", tol: {edge: 0.15, thickness: 0.10}}
    - {id: I_KP,  aka: [R1 kitchen_south, R2 I_KP],  rect: [31.507, 13.5, 38.764, 14.002],  note: "kitchen | pooja + store; door D4 in gap x 38.764-41.756", tol: {edge: 0.15, thickness: 0.10}}
    - {id: I_PS,  aka: [R1 pooja_store, R2 I_PS],    rect: [36.255, 9.505, 36.757, 13.5],   note: pooja | store, tol: {edge: 0.15, thickness: 0.10}}
  must_not_contain: plot wall pieces (x < 0, y < 0, x > 42.508 or y > 24.0); planter edge lines; entrance step

