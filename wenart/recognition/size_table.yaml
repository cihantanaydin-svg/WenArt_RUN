# Plausible footprint of every furniture type of the building schema, seen from above (docs/milestone7.md §3.2).
#
# width and depth are [min, max] in metres. A footprint (a, b) fits a type when it lies in the ranges in either
# orientation, with `tolerance` (+15 %) on top: min / 1.15 <= side <= max * 1.15 (the reader applies it, see
# wenart/recognition/symbols.py `fits` and wenart/ingest/generic/symbols.py `fits`).
# `unknown` has no entry on purpose: it is not a type a footprint can fit (the composite split of §2.8 treats a
# cluster that fits no type as a possible group).
#
# Used by: the generic core (block-name check, composite split, rule types), the two-pass rule (§3.3: both passes
# must name the type AND the footprint must fit it).
#
# Sources (checked 3 Oct 2026):
#   std  = common furniture and sanitary-ware sizes as published in planning handbooks and manufacturer ranges
#          (single beds 90-120 x 190-200 cm, doubles 135-180 (king 200) x 190-210, sofas of 2-3 seats 140-240 x
#          80-100, dining tables 75-110 wide, kitchen base units 60 deep); ranges widened to cover the other two
#          sources; not checked against one specific standard
#   syn  = the synthetic drawing blocks (wenart/synthetic/blocks.py BLOCKS) and the layout sizes
#          (wenart/furniture/schemas.py SIZE_OPTIONS): every one of them fits its type here
#   r01  = the real01 reference (tests/fixtures/real01_reference.yaml), measured in the PDF
tolerance: 0.15
types:
  bed_single:      {width: [0.80, 1.20], depth: [1.80, 2.20], source: "std; syn 0.9-1.2 x 1.9-2.0"}
  bed_double:      {width: [1.35, 2.00], depth: [1.85, 2.25], source: "std; syn 1.4-1.8 x 2.0; r01 F1/F4 1.78 x 2.03"}
  sofa:            {width: [1.20, 3.00], depth: [0.70, 1.10], source: "std; syn 1.6-2.6 x 0.9-0.95; r01 F14/F15 1.90 x 0.70"}
  armchair:        {width: [0.60, 1.10], depth: [0.60, 1.10], source: "std; syn 0.8-1.0 square"}
