# Milestone 13 (docs/milestone13.md §3.0 K1, §5.3, §13.2; track T1; user OK D5 of 12 Oct 2026): the product grid of
# wenart.furniture.sizes.snap_size / PRODUCT_GRID. A drawn furniture size outside its type's width / depth ranges above
# (a block with its neighbours, a split artefact, a misread symbol) is snapped to the nearest grid row before the fit
# (adjusted_by_ai, drawn_footprint kept; off with furnished_rooms: keep or furnished_rooms_keep_size). Rows are
# [w, d, h, "size class: sources"] in metres, width along the front, 5 cm classes of real products; a drawn footprint
# inside the ranges is never changed, so the grid only decides where an out-of-range size goes. Nearest = the smallest
# largest-axis change (max of |ln(w / w_row)|, |ln(d / d_row)|), ties by the sum, then the row order; a square drawn
# footprint takes square rows only (a round symbol is a round product). A run type (run: true) keeps its drawn length
# (clamped to the width range) and snaps its depth to the nearest row depth. Types without a block here use their
# `products` rows (with the default product's height).
# Sources: abo = ABO products of wenart/furniture/catalog_library.json (Amazon Berkeley Objects, CC BY 4.0; the title
# gives the size in cm or inches where quoted, else the measured box of the GLB in metres, real_product true);
# ph = Poly Haven models of wenart/furniture/catalog.json (box measured from the glTF, dimensions from
# api.polyhaven.com); syn = the layout sizes (wenart/furniture/schemas.py SIZE_OPTIONS); r01 / m10 / m11 / m12 = the
# drawings as above; std = the planning-handbook ranges of the `source` fields above. Every row lies inside its type's
# ranges (tests/test_m13_fit.py checks it).
grid:
  bed_double:
    # a drawn width beyond the range (real04 YATAK block 2.55 x 2.00: the bed with its two nightstands) is a block, not
