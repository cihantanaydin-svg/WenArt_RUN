# Real sizes of every furniture type of the building schema (docs/milestone7.md §3.2) and, from Milestone 12, of the
# library decor types: ONE table for the reader, the layout checks (F2), the scene checks (S4), the solver, the fit and
# the library audit (docs/milestone12.md §6.3 D23; owner track B; read through wenart/furniture/sizes.py).
#
# width and depth are [min, max] in metres, seen from above; width runs along the piece's front (the layout's
# convention, wenart/furniture/schemas.py SIZE_OPTIONS: a bed's foot end, a sofa's seat side, a crib's long side).
# A footprint (a, b) fits a type when it lies in the ranges in either orientation, with `tolerance` (+15 %) on top:
# min / 1.15 <= side <= max * 1.15 (the readers apply it, see wenart/recognition/symbols.py `fits`,
# wenart/ingest/generic/symbols.py `fits` and wenart/furniture/sizes.py `fits`).
# `unknown` has no entry on purpose: it is not a type a footprint can fit (the composite split of §2.8 treats a
# cluster that fits no type as a possible group).
#
# Milestone 12 fields (the readers above use width and depth only; they ignore the rest):
#   height    [min, max] overall height in metres (with headboards, backs, splashbacks); null: no height (stair)
#   product   [w, d, h] the default real product (width along the front, depth, height)
#   products  standard real footprints [w, d] (or [w, d, h]) of the type, in the front convention: the nearest one
#             is the product size of a misread drawn piece (sizes.product_size); the default product comes first
#   run       true: the width is a run length (counters), product_size keeps the drawn length and snaps the depth
#   decor     the library decor types (the catalogue's `decor` section, type decor_<name>), same fields; not under
#             `types` because the readers type drawn furniture only
#
# Used by: the generic core (block-name check, composite split, rule types), the two-pass rule (§3.3: both passes
# must name the type AND the footprint must fit it), F2, S4, the solver's product sizes, the fit's real-size rank and
# the library audit's size check (wenart/assets/audit/checks.py `size_check`).
#
# Sources (checked 3 Oct 2026):
#   std  = common furniture and sanitary-ware sizes as published in planning handbooks and manufacturer ranges
#          (single beds 90-120 x 190-200 cm, doubles 135-180 (king 200) x 190-210, sofas of 2-3 seats 140-240 x
#          80-100, dining tables 75-110 wide, kitchen base units 60 deep); ranges widened to cover the other two
#          sources; not checked against one specific standard
#   syn  = the synthetic drawing blocks (wenart/synthetic/blocks.py BLOCKS) and the layout sizes
#          (wenart/furniture/schemas.py SIZE_OPTIONS): every one of them fits its type here, in the same orientation
#   r01  = the real01 reference (tests/fixtures/real01_reference.yaml), measured in the PDF
#   lib  = the library's height and footprint ranges (wenart/assets/objaverse.yaml types, furniture_sizes,
#          decor_sizes; product ranges of the ABO listings read on 4 and 8 Oct 2026)
#   abo  = Milestone 12 review (10 Oct 2026): the 77 ABO products of the library catalogue whose titles give their
#          size in cm (wenart/assets/audit/checks.py `title_size`, tests/test_library_sizes.py); 72 fit their
#          type's ranges and heights as they were; of the other 5, two chests of drawers and a bathroom column are
#          real products of their type (ranges widened below), a wardrobe is filed as a tall cabinet ("Armoire":
#          the audit retypes it) and a desk's box (0.94 m deep) is not its title's 0.60 m (a listing variant).
#          Then every ABO product (units known) against the table: two more real products outside it (a task floor
#          lamp, a counter stool) widened the rows below; the rest fit
#
# Milestone 12 changes (every one with its source; tests/test_library_sizes.py checks them):
#   crib      width/depth swapped to [1.15, 1.50] x [0.60, 0.85]: the front of a crib is a long side (layout
#             SIZE_OPTIONS 1.26 x 0.66 .. 1.46 x 0.76, objaverse.yaml front words); the readers accept either
#             orientation, so only the orientation of an unfronted crib changes (symbols.oriented_size)
#   dresser   width min 0.80 -> 0.70, depth min 0.40 -> 0.35: ABO B079X4CP3F "Movian Hulio ... 4 Drawer Chest Of
#             Drawers, 72 x 75 x 36 cm" (box 0.75 x 0.36 x 0.72 m) and B01557QQSW "Movian ... credenze modello
#             Minho, 98 x 90 x 38 cm" (box 0.98 x 0.38 x 0.90 m)
#   tall_cabinet depth min 0.30 -> 0.25: ABO B07RMJPJMX "Movian Argenton - Colonna da bagno, 30 x 27 x 140 cm"
#             (box 0.30 x 0.27 x 1.40 m)
#   floor_lamp width and depth [0.25, 0.60] -> [0.20, 0.70]: ABO B07374K536 "Rivet Caden Adjustable Task Floor
#             Lamp" (box 0.24 x 0.62 x 1.63 m: an arm reaching out)
#   bar_stool width max 0.50 -> 0.60, depth max 0.50 -> 0.70: the ABO bar stools of the library are 0.38-0.57 x
#             0.36-0.66 m (bases and footrests), B075YQ478W "Stone & Beam Carson ... Counter Height Kitchen Stool"
#             0.49 x 0.66 x 1.08 m; the library's own range was already 0.30-0.70 (lib)
#   heights   new, from lib (objaverse.yaml types), with three real-product changes: bathtub [0.40, 0.80] ->
#             [0.40, 0.72] (std: built-in tubs with a panel 0.55-0.60 m, freestanding 0.55-0.72 m; the generated
#             0.80 m tubs of the diagnosis, docs/milestone12.md §1.6, are not real), wardrobe [1.40, 2.60] ->
#             [1.50, 2.45] (std: free-standing wardrobes 1.8-2.4 m; ABO 1.81-2.26 m), table_dining [0.65, 0.85] ->
#             [0.65, 0.92] (ABO dining tables 0.66-0.96 m: counter-height tables); new rows for the types without
#             a library height: kitchen_counter [0.85, 0.95], kitchen_island [0.85, 1.10] (std: base units 0.85-0.90
#             m plus the worktop; bar-height islands to 1.05 m), stair none (one storey)
#   products  new: the layout sizes (syn) first, then std product sizes; the default product's height is the
#             median ABO box height of the type where ABO has real products (abo), else std
