# Project defaults (docs/plan.md §1). Every value here is an assumption:
# a module that uses one records it as "assumed" in its output (style.json
# warnings, scene_manifest.json), never silently.

style:
  # Used when a project has no brief.yaml or no style text in it.
  text: "Scandinavian, light oak floor, white walls, linen textiles, warm daylight"
  # Slot fallbacks when neither the brief nor a style family word names them.
  fallback:
    floor: wood_oak_light
    walls: plaster_white
    light: warm daylight
  # The profile wenart.style produces from `text` above. tests/test_style.py
  # checks that this block and the code agree, so keep both in sync.
  profile:
    source_text: "Scandinavian, light oak floor, white walls, linen textiles, warm daylight"
    family: scandinavian   # Milestone 7: the library style filter of refit (docs/milestone7.md §6.3)
    floor: {material: wood_oak_light, asset: WoodFloor051}
    walls: {material: plaster_white, asset: white_plaster_02}
    ceiling: {material: plaster_white}
    wet_floor: {material: tiles_light, asset: Tiles074}
    wet_walls: {material: tiles_light}
    trim: {material: painted_wood_white}
    door: {material: wood_oak_light}
    window_frame: {material: painted_metal_white}
    lighting:
      hdri: kloppenheim_06
      sun_elevation_deg: 35
      sun_azimuth_deg: 210
      sun_strength: 3.0
      colour_temperature_k: 5200
      mood: warm daylight
    matched_terms: [Scandinavian, light oak floor, white walls, warm daylight]
    unmatched_terms: [linen textiles]
    warnings: []
  # Milestone 10 (docs/milestone10.md §1.3, §4.8): exterior slots used when neither the brief's exterior: block
  # nor the style text names them; every use is listed as assumed. The user left real02's exterior look open
  # (8 Oct 2026), so these apply there too.
  exterior_fallback:
    facade: render_wall_colour        # smooth render in the interior wall colour of the style
    roof: concrete_tiles_anthracite
    window_frame: interior            # the interior window frame material, seen from outside
    door: interior                    # the entrance door takes the interior door look
    paving: paving_concrete_grey
    garden: grass

# Brief keys and their defaults; wenart.brief.load_brief merges brief.yaml
# over this block and lists every key it took from here as assumed.
brief:
  empty_rooms: ai        # rooms with no documented furniture: furnish with AI (Milestone 4)
  decor: true            # small decor in documented rooms (cushions, plants, books)
  polish: true           # AI polish of the Cycles renders (Milestone 5); false = every view stays Cycles
  style_photos: []       # photos in projects/<p>/style_photos/ used as style references; [] = every photo there
  ceiling_height: 2.70   # metres, when no section or elevation gives it
  slab_thickness: 0.20   # metres, when no section gives it (Milestone 10; the M3-M9 builders assumed 0.30 / 0.15)
  # Milestone 10 (docs/milestone10.md §1.3, user decisions of 8 Oct 2026):
  furnished_rooms: complete        # keep = M9 (drawn furniture only restyled) | complete = AI redesigns drawn pieces and adds the missing ones
  furnished_rooms_keep: []         # room ids or labels that always stay keep
  furnished_rooms_keep_size: false # true: drawn type and size stay, only the look changes
  variants: all                    # all | base | a list of alternative names (as titled)
  failed_levels: leave_out         # leave_out (listed, levels above too) | stop (the project ends needs_review)
  site: full                       # full = plot, paving, grass, plot wall, parking as drawn | ground = a neutral ground plane
  exterior:                        # words for the outside; empty = style words where they fit, else style.exterior_fallback (assumed)
    facade: null
    roof: null
    window_frame: null
    door: null
    paving: null
    garden: null
  render:
    views_per_room: 3
    resolution: [1920, 1080]
    samples: 256
    # Camera lens in mm on the 36 mm sensor (Milestone 8, docs/milestone8.md §5): auto = 18 mm, 16 mm in rooms
    # narrower than 2.2 m (wenart.blender.cameras.room_lens); a number from 14 to 35 sets every searched camera.
    lens_mm: auto
    exterior_views: true   # Milestone 10: 4 corner views, one 3/4 aerial view, one per drawn elevation
    twin_rooms: one        # Milestone 10: one = a mirrored twin room of a semi-detached pair is rendered once | all
