# The furniture library of every source: the Objaverse 1.0 survey (docs/milestone7.md §7) and the shared steps
# (thumbnails, judging, acceptance, catalogue) for every source's survey records (docs/milestone8.md §2: Objaverse,
# ABO from wenart/assets/abo.yaml, generated models from wenart/assets/generate.py).
#
# Read by wenart/assets/objaverse.py (`load_config`). Tables only: the rules that use them live in the module.
#
# Verified from the session on 3 Oct 2026 (Hugging Face API, no LFS download):
#   GET https://huggingface.co/api/datasets/allenai/objaverse/tree/<revision> -> lvis-annotations.json.gz
#   (924,451 B), object-paths.json.gz (19,803,736 B), metadata/ (160 shards 000-000.json.gz ... 000-159.json.gz,
#   577 MB in all), glbs/ (160 folders 000-000 ... 000-159); README.md: "ODC-By v1.0 ... Individual objects ...
#   CC-BY 4.0 (721K objects), CC-BY-NC 4.0 (25K), CC-BY-NC-SA 4.0 (52K), CC-BY-SA 4.0 (16K), CC0 1.0 (3.5K). The
#   metadata will provide the license for each object."
# Checked on the M7 prep pod (87xpy12z302wrz, 3 Oct 2026, runs/20261003-173020-prep/results/library/survey.json):
# licence values by 1369, by-sa 77, by-nc 35, by-nc-sa 16, cc0 1 (so `by` and `cc0` occur); LVIS categories
# `chest_of_drawers_(furniture)` and `nightstand` are not in lvis-annotations.json.gz (every other one is).
# Milestone 8 (user decisions 3 and 4 of 4 Oct 2026, "licences may be ignored for now"): every licence is taken and
# recorded; anything but CC0 / CC BY 4.0 carries a `licence_flag` (never filtered while the user allows it).

dataset:
  repo: allenai/objaverse
  repo_type: dataset
  revision: 21e4e142159e2153706c23a3a02e55cec5591cea
  licence: ODC-By-1.0
  licence_url: https://opendatacommons.org/licenses/by/1-0/
  page: https://huggingface.co/datasets/allenai/objaverse
  lvis_file: lvis-annotations.json.gz          # {lvis category: [uid, ...]} (to verify on the pod)
  paths_file: object-paths.json.gz             # {uid: "glbs/000-NNN/<uid>.glb"} (to verify on the pod)
  metadata_dir: metadata                       # metadata/000-NNN.json.gz = {uid: Sketchfab record}; NNN = the glbs folder

# Fields of a metadata record (Sketchfab API v3 model records as published with Objaverse 1.0; to verify on the
# pod). A record without the credit fields is refused (CC BY 4.0 §3(a)(1) needs title, author and a link).
metadata_fields:
  licence: license
  title: name
  author: [user, displayName]
  author_fallback: [user, username]
  source_url: viewerUrl
  face_count: [archives, glb, faceCount]
  face_count_fallback: faceCount
  glb_size: [archives, glb, size]              # bytes
  texture_count: [archives, glb, textureCount]
  likes: likeCount
  views: viewCount

# Licence values of the metadata field `license` (compared case-insensitively, spaces collapsed) -> the catalogue
# licence (wenart/furniture/catalog.py LICENCE_FLAGS). `accept`: CC0 and CC BY 4.0 (licence_flag null); the Sketchfab
# slugs `cc0` and `by` are what the Objaverse 1.0 metadata holds (seen on the 3 Oct 2026 prep pod: by 1369, cc0 1);
# the long forms are the README's names of the same licences. `flagged` (Milestone 8): taken with the licence's flag
# (non_commercial for any NC and Sketchfab's Editorial licence, no_derivatives, share_alike; Sketchfab's Standard and
# Free Standard store licences are not Creative Commons: unknown). Every other value, and no value, is taken as
# licence `unknown` with flag `unknown` (the raw value is kept in licence_raw).
licences:
  verified: true                               # the prep pod's survey.json (3 Oct 2026) shows `by` and `cc0`
  accept:
    CC0: [cc0, "cc0 1.0", "cc0-1.0"]
    CC-BY-4.0: [by, "cc-by 4.0", "cc by 4.0", "cc-by-4.0"]
  flagged:
    CC-BY-NC-4.0: [by-nc, "cc-by-nc 4.0", "cc-by-nc-4.0"]
    CC-BY-NC-SA-4.0: [by-nc-sa, "cc-by-nc-sa 4.0", "cc-by-nc-sa-4.0"]
    CC-BY-NC-ND-4.0: [by-nc-nd, "cc-by-nc-nd 4.0", "cc-by-nc-nd-4.0"]
    CC-BY-SA-4.0: [by-sa, "cc-by-sa 4.0", "cc-by-sa-4.0"]
    CC-BY-ND-4.0: [by-nd, "cc-by-nd 4.0", "cc-by-nd-4.0"]
    Sketchfab-Standard: [st]
    Sketchfab-Free-Standard: [free-st]
    Sketchfab-Editorial: [ed]
  unknown: unknown                             # the catalogue licence of any other value (flag unknown)
  urls:
    CC0: https://creativecommons.org/publicdomain/zero/1.0/
    CC-BY-4.0: https://creativecommons.org/licenses/by/4.0/
    CC-BY-NC-4.0: https://creativecommons.org/licenses/by-nc/4.0/
    CC-BY-NC-SA-4.0: https://creativecommons.org/licenses/by-nc-sa/4.0/
    CC-BY-NC-ND-4.0: https://creativecommons.org/licenses/by-nc-nd/4.0/
    CC-BY-SA-4.0: https://creativecommons.org/licenses/by-sa/4.0/
    CC-BY-ND-4.0: https://creativecommons.org/licenses/by-nd/4.0/
    Sketchfab-Standard: https://sketchfab.com/licenses
    Sketchfab-Free-Standard: https://sketchfab.com/licenses
    Sketchfab-Editorial: https://sketchfab.com/licenses
    unknown: https://huggingface.co/datasets/allenai/objaverse
  names:                                       # as printed in the credit line (docs/milestone7.md §7.3)
    CC0: CC0 1.0
    CC-BY-4.0: CC BY 4.0
    CC-BY-NC-4.0: CC BY-NC 4.0
    CC-BY-NC-SA-4.0: CC BY-NC-SA 4.0
    CC-BY-NC-ND-4.0: CC BY-NC-ND 4.0
    CC-BY-SA-4.0: CC BY-SA 4.0
    CC-BY-ND-4.0: CC BY-ND 4.0
    Sketchfab-Standard: Sketchfab Standard licence
    Sketchfab-Free-Standard: Sketchfab Free Standard licence
    Sketchfab-Editorial: Sketchfab Editorial licence
    unknown: licence unknown

# Prefilter (§7.1 step 4): metadata first, then the downloaded file.
prefilter:
  face_count: [2000, 150000]                   # triangles of the GLB archive
  max_glb_mb: 40
  per_type_limit: 24                           # <= 24 candidates per furniture type (docs/milestone8.md §2; M7: 8;
                                               # a category that maps to two types, `bed`, may hold 24 per type
                                               # before the size split)
  max_downloads_per_type: 48                   # downloads tried in rank order until per_type_limit pass the file checks
  rank: [likes, views]                         # descending; ties by uid
  # Milestone 9 (docs/milestone9.md §2.2): the fixture categories. The M8 survey refused most of them before any judge
  # saw them (toilet: 35 of 48 tried `untextured`, 49 of 111 outside the face count). Plain sanitary ware and
  # appliances look right with flat material colours, so a model of these categories without textures is taken when
  # its materials have colours (`allow_flat_colours`), with a wider face count and more candidates. Every other
  # category keeps the values above (its pick order and candidates stay the M8 ones).
  overrides:
    toilet: &fixture {face_count: [800, 400000], allow_flat_colours: true, per_type_limit: 40,
                      max_downloads_per_type: 80}
    sink: *fixture
    bathtub: *fixture
    refrigerator: *fixture
    stove: *fixture
    # Milestone 10 (docs/milestone10.md §7 pod L1): the decor categories and the two types Objaverse mostly fills
    # (cribs and bunk beds: painted wood, often flat-coloured) take flat-coloured models, a wider face count (candles,
    # books and trays are low-poly) and 40 candidates, like the fixtures. The judges still need quality >= 4.
    crib: &m10_decor {face_count: [500, 400000], allow_flat_colours: true, per_type_limit: 40,
                      max_downloads_per_type: 80}
    bunk_bed: *m10_decor
    curtain: *m10_decor
    curtain_blind: *m10_decor
    blanket: *m10_decor
    book: *m10_decor
    candle: *m10_decor
    candle_holder: *m10_decor
    basket: *m10_decor
    tray: *m10_decor
    clock: *m10_decor
    wall_clock: *m10_decor
    sculpture: *m10_decor
    statue_(sculpture): *m10_decor
    figurine: *m10_decor
    flowerpot_plant_large: *m10_decor
    chandelier: *m10_decor
    lamp_pendant: *m10_decor
    lamp_ceiling: *m10_decor

# LVIS category -> furniture type(s) (§7.1 step 2). Checked on the 3 Oct 2026 prep pod against
# lvis-annotations.json.gz: all found except `nightstand` and `chest_of_drawers_(furniture)` (kept: a missing name
# only leaves its type parametric, with a warning; no alternate is added without a name seen in the file, which the
# next survey lists under lvis.near_missing). `chair` is not in the §7.1 list; it is added because
# the dining chair is the most repeated drawn piece (real01 has 6) and LVIS has the category (spec_deviations).
# No category for tv_unit, kitchen_counter, kitchen_island, sink_kitchen, shower, washing_machine, side_table,
# stair: those stay parametric.
categories:
  bed: {types: [bed_double, bed_single]}       # split by the bed width after the unit guess (bed_split_width_m)
  sofa: {types: [sofa]}
  armchair: {types: [armchair]}
  chair: {types: [chair]}
  dining_table: {types: [table_dining]}
  coffee_table: {types: [table_coffee]}
  bookcase: {types: [bookshelf]}
  wardrobe: {types: [wardrobe]}
  armoire: {types: [wardrobe]}
  nightstand: {types: [nightstand]}
  chest_of_drawers_(furniture): {types: [dresser]}
  desk: {types: [desk]}
  toilet: {types: [toilet]}
  sink: {types: [washbasin]}                   # LVIS `sink` holds kitchen sinks too: the judges' matches_type decides
  bathtub: {types: [bathtub]}
  refrigerator: {types: [fridge]}
  stove: {types: [stove]}
  lamp: {types: [floor_lamp], prefer_words: [floor, standing]}   # floor lamp by height; titles/tags with these
                                                                 # words rank first (a ranking hint, never a decision)
  flowerpot: {types: [potted_plant]}

  # ---- Milestone 10 (docs/milestone10.md §4.5, §4.6, §7 pod L1). The LVIS names below are all in the official LVIS v1
  # category list (lvis_v1_val.json `categories`, read 8 Oct 2026 from detectron2/data/datasets/lvis_v1_categories.py,
  # which is generated from it); the Objaverse file holds LVIS v1 names (M7: only `nightstand` and
  # `chest_of_drawers_(furniture)` were missing, and neither is a v1 name), but a name missing from the file is only
  # listed by the survey (lvis.near_missing). LVIS has no category for pendant or ceiling lights, console tables,
  # sideboards, shoe, display, tall and wall cabinets, office chairs, corner sofas, blinds or plant species: those
  # entries read a broader LVIS category (`lvis:`) and keep the objects whose title or tags hold one of
  # `require_words` (whole words from the start; an entry with words wins over the plain entries of its LVIS
  # category; two entries of different types matching one object refuse it `several_types`). `prefer_words` only
  # ranks. Both judges still decide `matches_type`. Objaverse has no LVIS category for palms, monsteras or ferns:
  # plant_large reads `flowerpot` for those words; the species come from the generated models (generate.yaml).
  dresser: {types: [dresser]}                  # LVIS v1 `dresser` (the M7 name `chest_of_drawers_(furniture)` is not in v1)
  crib: {types: [crib]}
  bunk_bed: {types: [bunk_bed]}
  ottoman: {types: [ottoman]}
  footstool: {types: [ottoman]}
  bench: {types: [bench]}
  chaise_longue: {types: [chaise]}
  stool: {types: [bar_stool], prefer_words: [bar, counter, barstool, high, tall]}   # LVIS `stool`: every stool; the
                                                                                    # height range keeps tall ones
  sofa_corner: {lvis: sofa, types: [sofa_corner], require_words: [sectional, corner, l-shaped, l-shape, l shaped,
                                                                 "l shape", chaise]}
  chair_office: {lvis: chair, types: [office_chair], require_words: [office, desk chair, swivel, task chair, gaming,
                                                                    computer chair, executive, ergonomic]}
  table_console: {lvis: table, types: [console_table], require_words: [console, entryway, hallway, "hall table",
                                                                       "sofa table", "entry table"]}
  cabinet_sideboard: {lvis: cabinet, types: [sideboard], require_words: [sideboard, buffet, credenza]}
  cabinet_shoe: {lvis: cabinet, types: [shoe_cabinet], require_words: [shoe, shoes]}
  cabinet_display: {lvis: cabinet, types: [display_cabinet], require_words: [display, curio, china, vitrine,
                                                                            "glass door", "glass doors"]}
  cabinet_tall: {lvis: cabinet, types: [tall_cabinet], require_words: [tall, pantry, linen, "storage tower"]}
  cabinet_wall: {lvis: cabinet, types: [wall_cabinet], require_words: [wall, hanging, medicine]}
  cupboard_sideboard: {lvis: cupboard, types: [sideboard], require_words: [sideboard, buffet, credenza]}
  cupboard_shoe: {lvis: cupboard, types: [shoe_cabinet], require_words: [shoe, shoes]}
  cupboard_display: {lvis: cupboard, types: [display_cabinet], require_words: [display, curio, china, vitrine,
                                                                              "glass door", "glass doors"]}
  cupboard_tall: {lvis: cupboard, types: [tall_cabinet], require_words: [tall, pantry, linen, "storage tower"]}
  cupboard_wall: {lvis: cupboard, types: [wall_cabinet], require_words: [wall, hanging, medicine]}
  bookcase_display: {lvis: bookcase, types: [display_cabinet], require_words: [display, curio, china, vitrine,
                                                                              "glass door", "glass doors"]}
  # decor (kind decor by the type; the catalogue's decor section)
  curtain: {types: [curtain]}
  curtain_blind: {lvis: curtain, types: [blind], require_words: [blind, blinds, roller, venetian, shade, shutter]}
  blanket: {types: [throw], prefer_words: [throw, plaid, knit]}
  book: {types: [books]}
  candle: {types: [candle]}
  candle_holder: {types: [candle]}
  basket: {types: [basket]}
  tray: {types: [tray]}
  clock: {types: [clock], prefer_words: [wall]}
  wall_clock: {types: [clock]}
  sculpture: {types: [sculpture]}
  statue_(sculpture): {types: [sculpture]}
  figurine: {types: [sculpture]}
  flowerpot_plant_large: {lvis: flowerpot, types: [plant_large], require_words: [palm, monstera, fern, ficus, fiddle,
                                                                                olive, "rubber plant", bamboo, banana,
                                                                                areca, yucca, "floor plant"]}
  chandelier: {types: [pendant_light]}
  lamp_pendant: {lvis: lamp, types: [pendant_light], require_words: [pendant, hanging, chandelier]}
  lamp_ceiling: {lvis: lamp, types: [ceiling_light], require_words: [flush, semi-flush, "ceiling light", "ceiling lamp",
                                                                     "ceiling mount"]}

# Unit guess (§7.2): the factors tried on the GLB's measured box; the one that puts the box in the type's size
# range is taken; more than one -> refused (never guessed). None (the model's units are unknown: 86 of 127
# candidates on the 3 Oct 2026 prep pod) -> normalised by type: scaled to the type's typical footprint (size table
# centre), unit_note "normalised by type (model units unknown)"; refused only when its proportions (footprint
# width / depth, height / width) are outside the type's ranges (objaverse.normalise_unit).
units: [1.0, 0.01, 0.0254, 0.001]
# Bed type by the width (the shorter side of the box): <= 1.275 m single, above it double (midway between the
# size table's single maximum 1.20 and double minimum 1.35, both inside the +15 % tolerance bands).
bed_split_width_m: 1.275

# Per type: plausible overall height in metres (plausibility filter for the unit guess; common furniture
# heights, widened: beds with headboards, sofas and armchairs with high backs, tall fridges) and the geometric
# front rule (§7.2, the Poly Haven rule of wenart/furniture/catalog.py):
#   back_taller - seating, beds, toilet, washbasin: the side under the top 30 % of the vertices is the back
#   detail_side - cabinets and appliances: the side with the doors, drawers, handles or knobs (more vertices in
#                 its 5 % slab) is the front
#   open_side   - open shelving: the side with the flat back panel (outward faces in its slab) is the back
#   none        - no front (tables, lamps, plants): front_axis -Y with front_axis_confidence low
#   documented  - only a front the source documents decides (ABO: glTF +Z = -Y, abo.yaml dataset.front_axis): wall
#                 art, whose picture side the geometry cannot tell; without one the object is refused
# Footprints come from wenart/recognition/size_table.yaml (width/depth, either orientation, its tolerance); the decor
# types (docs/milestone8.md §4) from `decor_sizes` below. side_table and tv_unit come from ABO only (no LVIS category).
types:
  bed_double:   {height: [0.25, 1.60], front: back_taller}
  bed_single:   {height: [0.25, 1.60], front: back_taller}
  sofa:         {height: [0.55, 1.20], front: back_taller}
  armchair:     {height: [0.60, 1.30], front: back_taller}
  chair:        {height: [0.70, 1.20], front: back_taller}
  table_dining: {height: [0.65, 0.85], front: none}
  table_coffee: {height: [0.25, 0.60], front: none}
  desk:         {height: [0.65, 1.20], front: detail_side}
  wardrobe:     {height: [1.40, 2.60], front: detail_side}
  bookshelf:    {height: [0.70, 2.50], front: open_side}
  nightstand:   {height: [0.35, 0.80], front: detail_side}
  dresser:      {height: [0.60, 1.40], front: detail_side}
  toilet:       {height: [0.35, 1.10], front: back_taller}
  washbasin:    {height: [0.10, 1.20], front: back_taller}
  bathtub:      {height: [0.40, 0.80], front: detail_side}
  fridge:       {height: [0.80, 2.10], front: detail_side}
  stove:        {height: [0.80, 1.20], front: detail_side}
  floor_lamp:   {height: [1.20, 2.10], front: none}
  potted_plant: {height: [0.30, 2.20], front: none}
  side_table:   {height: [0.35, 0.85], front: none}
  tv_unit:      {height: [0.30, 1.00], front: detail_side}
  # M8 pod L2: the generator fills these; without a height range every candidate was refused unit_none.
  washing_machine: {height: [0.80, 0.95], front: detail_side}
  sink_kitchen: {height: [0.80, 1.30], front: detail_side}   # base unit with the sink, tap included
  shower:       {height: [1.80, 2.40], front: none}          # enclosure on its tray; the drawn footprint orients it
  # decor (kind decor; the catalogue's `decor` section, type decor_<name>)
  rug:          {height: [0.002, 0.08], front: none}
  wall_art:     {height: [0.15, 1.80], front: documented}
  cushion:      {height: [0.15, 0.75], front: none}
  plant:        {height: [0.15, 2.20], front: none}
  # Milestone 9 decor types (docs/milestone9.md §3): tabletop decor and the wall mirror. Product sizes (vases 3 to
  # 24 in, decorative bowls 5 to 20 in, small potted plants 4 to 24 in, table lamps 10 to 34 in, wall mirrors 12 x 16
  # in to 36 x 48 in), widened; the ABO VASE, LAMP and HOME_MIRROR boxes of 4 Oct 2026 fit.
  vase:         {height: [0.06, 0.75], front: none}
  bowl:         {height: [0.02, 0.30], front: none}
  plant_small:  {height: [0.10, 0.75], front: none}
  table_lamp:   {height: [0.20, 0.95], front: none}
  mirror:       {height: [0.25, 1.40], front: documented}

  # Milestone 10 furniture types (docs/milestone10.md §1.1, §4.5). Heights are the product ranges of the ABO listings
  # read on 8 Oct 2026 (results/library/survey_m10_session.json), widened a little. Fronts: seating by its back
  # (back_taller; a backless piece is refused for Objaverse, ABO documents its front), cabinets by their doors
  # (detail_side), tables and ottomans have none; the crib, the bunk bed and the wall clock have a front only the
  # source documents (ABO) or both judges agree on (front_by_judges: the geometry cannot tell the open side or the
  # clock face, the render can; confidence medium; wall art and mirrors keep the M8 rule: the source only).
  sofa_corner:  {height: [0.55, 1.20], front: back_taller}
  chaise:       {height: [0.55, 1.20], front: back_taller}
  ottoman:      {height: [0.25, 0.65], front: none}
  bench:        {height: [0.35, 1.00], front: back_taller}
  bar_stool:    {height: [0.55, 1.25], front: back_taller}
  office_chair: {height: [0.70, 1.40], front: back_taller}
  console_table: {height: [0.55, 1.10], front: none}
  crib:         {height: [0.70, 1.30], front: documented, front_by_judges: true}
  bunk_bed:     {height: [1.00, 2.10], front: documented, front_by_judges: true}   # a floor bunk bed is 1.2 m high
  sideboard:    {height: [0.60, 1.20], front: detail_side}
  shoe_cabinet: {height: [0.30, 1.80], front: detail_side}
  display_cabinet: {height: [1.20, 2.40], front: detail_side}
  tall_cabinet: {height: [1.20, 2.40], front: detail_side}
  wall_cabinet: {height: [0.30, 1.00], front: detail_side}
  # Milestone 10 decor types (docs/milestone10.md §1.1, §4.6). Product sizes: curtain panels 0.5 to 1.5 m wide and
  # 2.0 to 3.0 m long, blinds 0.4 to 2.5 m wide, throws folded or draped 0.4 to 1.9 m, book stacks 5 to 40 cm,
  # candles and holders 4 to 80 cm, baskets 0.15 to 0.9 m, trays 15 to 80 cm, wall clocks 15 to 130 cm, sculptures
  # and figurines 10 to 120 cm, large floor plants 0.9 to 2.6 m, pendants (with their drop) and ceiling lights.
  curtain:      {height: [0.80, 3.20], front: none}
  blind:        {height: [0.40, 3.00], front: none}
  throw:        {height: [0.03, 0.80], front: none}
  books:        {height: [0.03, 0.50], front: none}
  candle:       {height: [0.04, 0.80], front: none}
  basket:       {height: [0.10, 0.80], front: none}
  tray:         {height: [0.01, 0.15], front: none}
  clock:        {height: [0.12, 1.30], front: documented, front_by_judges: true}
  sculpture:    {height: [0.08, 1.30], front: none}
  plant_large:  {height: [0.90, 2.60], front: none}
  pendant_light: {height: [0.10, 2.20], front: none}
  ceiling_light: {height: [0.03, 0.60], front: none}

# Footprints of the Milestone 10 furniture types (the size table format of wenart/recognition/size_table.yaml: width /
# depth in metres, either orientation, + its 15 % tolerance). The library's own plausibility ranges, from the ABO
# product boxes read on 8 Oct 2026 (sofa chaise 2.44 x 1.62, sectionals to 3.6 m, chaise lounges 0.7 x 1.4-2.0, bar
# stools 0.4-0.7, office chairs 0.5-0.8, console tables 1.0-1.8 x 0.3-0.45, storage benches 0.9-1.5 x 0.35-0.45);
# crib 0.7 x 1.3 m (US 28 x 52 in), bunk bed 0.9 x 2.0 m. They win over wenart/recognition/size_table.yaml for these
# types (the drawn-footprint ranges of track A3 may differ: a drawn L-shaped sofa is its bounding rectangle).
furniture_sizes:
  sofa_corner:  {width: [1.60, 4.00], depth: [1.30, 3.20]}
  chaise:       {width: [0.55, 1.05], depth: [1.15, 2.20]}
  ottoman:      {width: [0.35, 1.40], depth: [0.35, 1.05]}
  bench:        {width: [0.70, 2.00], depth: [0.28, 0.70]}
  bar_stool:    {width: [0.30, 0.70], depth: [0.30, 0.70]}
  office_chair: {width: [0.45, 0.90], depth: [0.45, 0.90]}
  console_table: {width: [0.70, 2.00], depth: [0.20, 0.55]}
  crib:         {width: [0.55, 0.85], depth: [1.00, 1.55]}
  bunk_bed:     {width: [0.80, 1.30], depth: [1.80, 2.30]}
  sideboard:    {width: [1.00, 2.40], depth: [0.28, 0.55]}
  shoe_cabinet: {width: [0.40, 1.60], depth: [0.20, 0.50]}
  display_cabinet: {width: [0.55, 1.60], depth: [0.25, 0.60]}
  tall_cabinet: {width: [0.30, 1.30], depth: [0.25, 0.65]}
  wall_cabinet: {width: [0.30, 1.40], depth: [0.12, 0.45]}

# Footprints of the decor types (the size table format: width / depth in metres, either orientation, + the size
# table's 15 % tolerance). Common product sizes (rugs 2 x 3 ft to 9 x 12 ft and runners; framed art 8 x 10 in to
# 60 x 60 in; throw pillows 12 x 20 in to 26 x 26 in; planters 4 in to 3 ft), widened; checked against the ABO
# metadata of 4 Oct 2026 (RUG, WALL_ART, PILLOW, PLANTER: their typical boxes fit).
decor_sizes:
  rug:      {width: [0.60, 4.50], depth: [0.40, 3.60]}
  wall_art: {width: [0.15, 2.40], depth: [0.003, 0.15]}
  cushion:  {width: [0.25, 0.90], depth: [0.05, 0.40]}
  plant:    {width: [0.10, 1.00], depth: [0.10, 1.00]}
  vase:        {width: [0.05, 0.45], depth: [0.05, 0.45]}       # Milestone 9 (docs/milestone9.md §3)
  bowl:        {width: [0.10, 0.60], depth: [0.10, 0.60]}
  plant_small: {width: [0.06, 0.50], depth: [0.06, 0.50]}
  table_lamp:  {width: [0.10, 0.60], depth: [0.10, 0.60]}
  mirror:      {width: [0.25, 1.50], depth: [0.004, 0.15]}      # wall mirrors only (floor and leaner mirrors are deeper)
  # Milestone 10 (docs/milestone10.md §4.6)
  curtain:     {width: [0.30, 3.50], depth: [0.01, 0.50]}
  blind:       {width: [0.30, 3.00], depth: [0.01, 0.35]}
  throw:       {width: [0.25, 2.00], depth: [0.15, 1.70]}
  books:       {width: [0.08, 0.60], depth: [0.06, 0.45]}
  candle:      {width: [0.03, 0.45], depth: [0.03, 0.45]}
  basket:      {width: [0.15, 0.95], depth: [0.15, 0.95]}
  tray:        {width: [0.15, 0.85], depth: [0.10, 0.65]}
  clock:       {width: [0.12, 1.35], depth: [0.008, 0.25]}          # wall clocks only (floor clocks are deeper)
  sculpture:   {width: [0.05, 0.90], depth: [0.05, 0.90]}
  plant_large: {width: [0.25, 1.30], depth: [0.25, 1.30]}
  pendant_light: {width: [0.08, 1.30], depth: [0.08, 1.30]}
  ceiling_light: {width: [0.12, 1.15], depth: [0.12, 1.15]}

front_rules:
  top_fraction: 0.30            # back_taller: vertices in the top 30 % of the height (as models.measure_gltf)
  side_fraction: 0.05           # detail_side / open_side: slab of 5 % of the extent at each side (as measure_gltf)
  back_taller: {min_offset: 0.08, dominance: 2.0}           # |top centroid offset| / extent on the decisive axis,
                                                            # and that many times the other axis's
  detail_side: {min_ratio: 1.3, dominance: 1.2, min_count: 20}   # vertex count ratio of the two slabs of an axis
  open_side: {min_panel: 0.5, max_open_share: 0.5, normal_dot: 0.9}  # outward face area / side area

# Thumbnails (§7.2): one Blender process, Cycles (GPU when available), four views of the GLB framed on its box.
# The four views are the four sides (camera on the model's -Y, +X, +Y, -X side, 30 degrees above), so the
# judges' front_view 0..3 names one model axis (spec_deviations: §7.2 lists front, 45 degrees, side, top).
thumbnails:
  resolution: 256
  samples: 16
  elevation_deg: 30
  lens_mm: 50
  sensor_mm: 36
  margin: 1.08
  background: 0.6               # uniform grey world (linear), strength 1
  sun_energy: 3.0
  sun_elevation_deg: 50
  sun_azimuth_offset_deg: 45    # the sun comes from the camera side, turned 45 degrees about the vertical
  sheet_jpeg_quality: 90        # 2 x 2 judging sheet, 512 px
  thumb_px: 256                 # thumbs/<type>/<uid>.jpg, the sheet scaled down
  thumb_jpeg_quality: 85

# Material slots and recolour support (Milestone 10, docs/milestone10.md §4.5; wenart/assets/recolour.py). Each material
# slot of an accepted model is tinted on a render of the model and both judges name its material; the agreed answers give
# the catalogue fields `material_slots`, `material_tags`, `recolourable_fabric`, `recolourable_wood`.
recolour:
  version: m10.1                # part of every request's input hash: bump when the question or the renders change
  tile_px: 256                  # one tile of the judging sheet: the model in its own colours, then one tile per slot
  columns: 3
  samples: 16                   # the model in its own colours (Cycles)
  mask_samples: 4               # the slot masks (white emission on black)
  albedo_samples: 8             # the flat-lit render (white world, no sun) whose slot colours the catalogue keeps
  elevation_deg: 30
  azimuth_deg: 35               # turned from the model's -Y side (a three-quarter view)
  back_azimuth_offset_deg: 180  # the second model tile: the opposite side
  highlight_rgb: [255, 0, 255]  # the tint of the slot under judgement
  highlight_alpha: 0.65
  mask_threshold: 0.5           # a mask pixel counts above this share of white
  min_mask_pixels: 24           # a slot seen in fewer pixels is not asked (hidden or tiny): material `other`, not asked
  max_slots_per_sheet: 6
  max_sheets_per_model: 2       # the largest slots by area come first; the rest stay `other`, not asked
  whole_model_share: 0.9        # one asked slot with at least this share is the whole model: no slot tile
  min_slot_share: 0.02          # a slot below this share of the model's surface area is not asked
  min_tag_share: 0.10           # material tag: the agreed slots of one material cover at least this share
  min_recolour_share: 0.05      # recolourable: an agreed, single-material slot of fabric (wood) of at least this share
  sheet_jpeg_quality: 90

# Bed frames (docs/milestone8.md §2): a bed both judges see without a mattress is a bed frame when the thumbnail step
# measures a deck: five rays straight down (the footprint centre and the points at +-0.2 of the box's x and y extents
# from it: inside the inner 50 % of the footprint), the topmost surface each ray meets, in the Z-up model frame; the
# deck height is the median of the hits above the box bottom, times the unit scale (metres). Fewer than `min_hits`
# hits, or a deck outside `deck_range_m` (a ray through the slats to the floor rail, a canopy) -> refused no_deck.
bed_frame:
  ray_offset: 0.2
  min_hits: 3
  deck_range_m: [0.08, 0.90]

accept:
  min_quality: 4                # both judges' photoreal_quality >= 4
  per_type_max: 20              # catalog_library.json keeps <= 20 per furniture type (docs/milestone9.md §1; M8: 12)
  decor_per_type_max: 20        # and <= 20 per decor type (M8: 16)
  per_family_max: 5             # first pass (styles spread): a model is kept while one of its families (`neutral`
                                # counts as one) has fewer than 5 kept models, and counts for each of them (M8: 3)
  style_fill: true              # fill pass (docs/milestone9.md §1): then the models the first pass left for their
                                # style, in rank order, until the type limit
  source_order: [abo, polyhaven, objaverse, generated]   # rank: mean quality, then this order, then the lower
                                                         # quality, likes, views, survey rank, uid

# The survey files the shared steps read (each source's survey writes its own; docs/milestone8.md §2).
survey_files:
  objaverse: survey.json
  abo: survey_abo.json
  generated: survey_generated.json

attribution:
  via: Objaverse (allenai/objaverse, ODC-By 1.0)
  changes: scaled to the drawn footprint, re-oriented, rendered, AI-retouched
