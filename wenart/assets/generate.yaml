    textile: natural white linen and soft grey wool, simple weave, light and airy
    plant: healthy green leaves, bright and natural
    lighting: white opal glass or a light oak and white fabric shade, simple rounded shape
    accessory: light oak, natural linen, white and pale grey, simple forms
  japandi:
    furniture: light ash wood, black accents, natural linen and paper textures, low profile, calm minimal forms
    fixtures: matte white and stone grey ceramic, black metal fittings, light ash wood accents, low calm forms
    decor: handmade matte stoneware in stone grey and charcoal, light ash wood, calm minimal forms
    textile: undyed linen and raw cotton in oatmeal and stone grey, soft drape, calm
    plant: healthy green leaves, calm and natural
    lighting: paper shade on a light ash wood frame, soft rounded form
    accessory: light ash wood, natural fibres, stone grey, calm minimal forms
  modern minimal:
    furniture: matte white and warm grey surfaces, flush panels, thin black metal details, no ornament
    fixtures: matte white surfaces, flush handleless fronts, thin black fittings, crisp rectangular forms
    decor: matte white and warm grey ceramic, thin black metal, crisp simple forms, no ornament
    textile: plain matte white and warm grey fabric, flat clean fall, no pattern
    plant: healthy green leaves, clean and simple
    lighting: matte white metal dome on a thin black cord, crisp simple form
    accessory: matte white and warm grey with thin black metal, crisp forms
  minimal:
