    textile: sandy cream linen and white cotton with a loose weave, relaxed folds
    plant: healthy green leaves, sunlit and relaxed
    lighting: woven rattan or white glass shade, warm natural tones, soft round form
    accessory: woven rattan and seagrass, terracotta and sand tones, soft rounded forms
  classic:
    furniture: carved dark walnut wood, tufted cream upholstery, turned legs, polished brass details
    fixtures: white porcelain, polished brass or chrome fittings, moulded classic details
    decor: white porcelain with gold rims, polished brass, moulded classic details
    textile: heavy cream and gold damask or velvet with pleats and tassels
    plant: healthy green leaves, lush and formal
