# Generated furniture (docs/milestone8.md §3): Z-Image-Turbo text-to-image, then TRELLIS.2-4B image-to-3D.
# Model ids, revisions, files and licences live only here; scripts/pod_setup_trellis.sh downloads exactly these
# (snapshot_download with the revision and allow_patterns below) and wenart/assets/generate.py loads the same local
# snapshots (wenart.hfcache.local_snapshot, so HF_HUB_OFFLINE=1 works). Checked on Hugging Face / GitHub, 4 Oct 2026.

models:
  # Text-to-image (the polish model, wenart/polish/polish.yaml; same revision and files).
  zimage:
    repo: Tongyi-MAI/Z-Image-Turbo
    revision: f332072aa78be7aecdf3ee76d5c247082da564a6
    licence: Apache-2.0
    allow_patterns: [model_index.json, "scheduler/*", "text_encoder/*", "tokenizer/*", "transformer/*", "vae/*"]
    size_gb: 32.85
  # Image-to-3D. pipeline.json of this revision names every part below (sparse structure decoder from TRELLIS v1,
  # DINOv3 as image condition, a BiRefNet background remover); the encoders (shape_enc, tex_enc) are not loaded by
  # Trellis2ImageTo3DPipeline and are not downloaded.
  trellis:
    repo: microsoft/TRELLIS.2-4B
    revision: af44b45f2e35a493886929c6d786e563ec68364d
    licence: MIT
    allow_patterns: [pipeline.json, "ckpts/ss_flow_img_dit_1_3B_64_bf16.*", "ckpts/slat_flow_*",
                     "ckpts/shape_dec_next_dc_f16c32_fp16.*", "ckpts/tex_dec_next_dc_f16c32_fp16.*"]
    size_gb: 14.8
  # pipeline.json: "sparse_structure_decoder": "microsoft/TRELLIS-image-large/ckpts/ss_dec_conv3d_16l8_fp16"
  # (fetched from the hub without a revision by the upstream loader; pinned here and linked locally).
  ss_decoder:
    repo: microsoft/TRELLIS-image-large
    revision: 25e0d31ffbebe4b5a97464dd851910efc3002d96
    licence: MIT
    allow_patterns: ["ckpts/ss_dec_conv3d_16l8_fp16.json", "ckpts/ss_dec_conv3d_16l8_fp16.safetensors"]
    files: ["ckpts/ss_dec_conv3d_16l8_fp16.json", "ckpts/ss_dec_conv3d_16l8_fp16.safetensors"]
    size_gb: 0.15
  # pipeline.json: image_cond_model DinoV3FeatureExtractor("facebook/dinov3-vitl16-pretrain-lvd1689m").
  # GATED with manual approval (DINOv3 License: commercial use allowed, custom terms, trade-control clauses):
  # the Hugging Face account of the RunPod secret hf_token must have been granted access on the model page.
  dinov3:
    repo: facebook/dinov3-vitl16-pretrain-lvd1689m
    revision: ea8dc2863c51be0a264bab82070e3e8836b02d51
    licence: DINOv3 License (custom, gated)
    gated: manual
    allow_patterns: [config.json, model.safetensors, preprocessor_config.json, LICENSE.md]
    files: [config.json, model.safetensors]
    size_gb: 1.21
  # pipeline.json names briaai/RMBG-2.0 (gated, licence bria-rmbg-2.0: non-commercial). It is replaced by the
  # BiRefNet general model it is built on (same architecture and loader class, MIT, not gated). Our input images
  # have a plain white background; the mask only needs to separate the object from it.
  rembg:
    repo: ZhengPeng7/BiRefNet
    revision: e2bf8e4460fc8fa32bba5ea4d94b3233d367b0e4
    licence: MIT
    replaces: briaai/RMBG-2.0
    allow_patterns: [config.json, BiRefNet_config.py, birefnet.py, model.safetensors]
    files: [config.json, BiRefNet_config.py, birefnet.py, model.safetensors]
    size_gb: 0.44

# The TRELLIS.2 code (MIT) that scripts/pod_setup_trellis.sh checks out (its TRELLIS_COMMIT must be this one;
# tests/test_generate.py checks it). main @ 5 Jun 2026; the code is unchanged since 10 Jan 2026 (CI files only).
trellis_code:
  repo: https://github.com/microsoft/TRELLIS.2
  commit: 75fbf0183001ed9876c8dbb35de6b68552ee08bd

# Z-Image-Turbo text-to-image (diffusers 0.40.0 ZImagePipeline). Its default sigmas are linspace(1, 1/n, n), so
# 8 steps are the 8 DiT forwards of the model card (whose num_inference_steps=9 is for the older pipeline that
# spent one step at sigma 0); guidance 0 for the Turbo model (model card). The noise comes from a CPU generator
# seeded per image (the same image on every GPU).
image:
  size: 1024
  steps: 8
  guidance_scale: 0.0

# TRELLIS.2: Trellis2ImageTo3DPipeline.run(image, seed=seed, pipeline_type=...) at the default resolution of
# pipeline.json (1024_cascade); mesh.simplify(16777216) as in example.py; o_voxel.postprocess.to_glb with the
# remesh settings of example.py / app.py, decimation to about 200k faces and 2048 px PBR textures (PNG, no WebP
# extension, so every glTF importer reads them).
trellis:
  pipeline_type: 1024_cascade
  simplify: 16777216
  decimation_target: 200000
  texture_size: 2048
  remesh: true
  remesh_band: 1
  remesh_project: 0
  # Keep every TRELLIS.2 model on the GPU (no CPU <-> GPU moves per stage) when the card has at least this much
  # memory; below it the upstream low-VRAM mode (models moved per stage) is used. Z-Image-Turbo is freed before
  # TRELLIS.2 loads, so the two never share the GPU.
  resident_min_vram_gib: 40

images_per_pair: 2
seed_base: 0          # image n of a pair: seed_base + sha256("<type>|<family>|<n>") mod 2^31 (stable, order-free)

# Milestone 9 (docs/milestone9.md §2.3): `plan --target N` plans ceil(deficit / target_accept_rate) new candidates per
# type (0.7: the M8 generated candidates that passed both judges, 35 of 50, before the type and style limits).
target_accept_rate: 0.7
# Decor types the generator makes (kind decor, the catalogue's decor section). M9: small tabletop objects; M10
# (docs/milestone10.md §4.6, §7 pod L2): the types ABO cannot fill (no curtain, blind, throw, book, large plant or
# sculpture; 4 trays, 6 candles, 7 baskets) and the lights. `plan --target 15` only plans the deficit.
decor_types: [vase, bowl, plant_small, curtain, blind, throw, books, candle, basket, tray, clock, sculpture, plant_large,
              pendant_light, ceiling_light]
# TRELLIS.2 settings of the decor items (small objects: the 512 pipeline of the pinned code, `run(pipeline_type=
# '512')`, checked in trellis2/pipelines/trellis2_image_to_3d.py @ 75fbf01 on 4 Oct 2026; smaller textures and meshes).
# Furniture keeps the settings above (and its M8 item keys).
trellis_decor:
  pipeline_type: "512"
  decimation_target: 100000
  texture_size: 1024
# Decor types that keep the furniture settings above (thin leaves and cloth folds need the 1024 cascade).
trellis_decor_full: [plant_large, curtain, blind]

# Fixed equipment never generated (docs/milestone8.md §3): stays parametric (or library) as drawn.
exclude_types: [stair, kitchen_counter, kitchen_island, unknown]

# Types whose look comes from ceramics, enamel and metal, not from furniture woods and fabrics: they take the
# family's "fixtures" hint.
fixture_types: [fridge, stove, sink_kitchen, washbasin, toilet, shower, bathtub, washing_machine]

# Milestone 10: the family_hints group of a type whose look is neither furniture nor ceramics (textiles, plants,
# lights, accessories). A type not listed here takes `fixtures` (fixture_types), `decor` (decor_types) or `furniture`.
hint_groups:
  curtain: textile
  blind: textile
  throw: textile
  plant_large: plant
  pendant_light: lighting
  ceiling_light: lighting
  books: accessory
  basket: accessory
  tray: accessory
  clock: accessory

# Milestone 10: types whose words have slots; image n of a pair takes variant (n - 1 + 2 * family number) of each list
# (species and pots cycle with different lengths, so the combinations spread over the families and images). The
# species and the pot go into the survey record, the catalogue (`species`, `pot`) and the decor item's fields.
variants:
  plant_large:
    plant:
      - {species: palm, words: "areca palm with many arching fronds"}
      - {species: monstera, words: "monstera deliciosa with large split leaves"}
      - {species: fiddle-leaf fig, words: "fiddle-leaf fig tree with large violin-shaped leaves"}
      - {species: olive, words: "olive tree with a slim trunk and narrow silvery leaves"}
      - {species: fern, words: "large boston fern with arching fronds"}
    pot:
      - {pot: rattan, words: "woven rattan basket"}
      - {pot: cream, words: "cream ceramic"}
      - {pot: terracotta, words: "terracotta"}
      - {pot: white, words: "matte white ceramic"}
      - {pot: black, words: "black ceramic"}
      - {pot: concrete, words: "grey concrete"}

prompt_template: >-
  a single {family} style {type_words}, {hints}, studio product photo, three-quarter front view from the left,
  full object in frame, plain white background, soft even light, no people, no text

# One specific object per type (the judge later checks that the model is this type).
