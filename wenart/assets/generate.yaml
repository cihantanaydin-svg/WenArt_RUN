  bed_double: double bed with a headboard, a mattress and plain bedding
  sofa: three-seat sofa
  armchair: upholstered armchair
  table_dining: rectangular dining table for six
  table_coffee: low coffee table
  desk: writing desk with a drawer
  chair: dining chair
  wardrobe: tall two-door wardrobe
  fridge: freestanding refrigerator
  stove: freestanding cooker with an oven and a four-burner hob
  sink_kitchen: kitchen sink base cabinet with a worktop and an inset sink
  washbasin: bathroom washbasin on a vanity unit
  toilet: floor-standing toilet with a cistern
  shower: square glass shower enclosure with a shower tray
  bathtub: freestanding bathtub
  tv_unit: low TV media console
  bookshelf: tall open bookshelf with empty shelves
  nightstand: bedside nightstand with one drawer
  dresser: chest of drawers
  washing_machine: front-loading washing machine
  side_table: small round side table
  floor_lamp: floor lamp with a fabric shade
  potted_plant: large indoor plant in a floor pot
  # Milestone 9 decor types (docs/milestone9.md §3)
  vase: decorative vase for a table or a sideboard
  bowl: shallow decorative bowl for a coffee table
  plant_small: small indoor plant in a pot for a table or a shelf
  # Milestone 10 furniture types (docs/milestone10.md §1.1, §4.5): one specific object each.
  sofa_corner: L-shaped corner sofa with a chaise section and loose back cushions
  chaise: upholstered chaise longue with one raised head end
  ottoman: square upholstered ottoman pouf on short legs
  bench: upholstered bench with a padded seat and wooden legs
  bar_stool: counter height bar stool with a low backrest and a footrest
  office_chair: ergonomic office desk chair with armrests on a five-star castor base
  console_table: narrow console table with two drawers for a hallway
  crib: baby crib with slatted sides
  bunk_bed: wooden bunk bed with a ladder and safety rails
  sideboard: low sideboard with sliding doors and drawers on slim legs
  shoe_cabinet: slim shoe cabinet with flap doors
  display_cabinet: tall display cabinet with glass doors and shelves
  tall_cabinet: tall narrow storage cabinet with two doors
  wall_cabinet: wall-mounted cabinet with two doors
  # Milestone 10 decor types (docs/milestone10.md §1.1, §4.6)
  curtain: pair of floor-length curtains hanging in soft folds from a curtain rod
  blind: window roller blind, half lowered, on its mounting bracket
  throw: folded throw blanket
  books: stack of three hardcover books lying flat
  candle: pillar candle in a holder
  basket: woven storage basket with two handles
  tray: rectangular serving tray with handles
  clock: round wall clock
  sculpture: abstract tabletop sculpture on a small base
  plant_large: "tall indoor {plant}, about 1.6 m high, in a {pot} floor pot"
  pendant_light: pendant lamp with a dome shade on a cord
  ceiling_light: flush mount ceiling light with a round shade

