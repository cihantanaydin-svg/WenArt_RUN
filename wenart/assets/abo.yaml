# Amazon Berkeley Objects (ABO) furniture and decor library: the survey (docs/milestone8.md §1, §2).
#
# Read by wenart/assets/abo.py (`load_config`). Tables only: the rules that use them live in the module. Thumbnails,
# judging, acceptance and the catalogue are the shared library steps of wenart/assets/objaverse.py.
#
# Verified from the session on 4 Oct 2026 (the metadata files downloaded from the bucket below and read here):
#   3dmodels/metadata/3dmodels.csv.gz: 7,953 rows; fields 3dmodel_id, path, meshes, materials, textures, images,
#     image_height_max, image_height_min, image_width_max, image_width_min, vertices, faces, extent_x, extent_y,
#     extent_z (metres, in the glTF frame: +Y up, so extent_y is the height and extent_z the depth).
#   listings/metadata/listings_{0..9,a..f}.json.gz: one JSON object per line; 7,960 listings carry a 3dmodel_id
#     (7,953 distinct models, 6 models listed twice; 484 listings without an English item_name).
#   3dmodels/README.md: "Creative Commons Attribution 4.0 International Public License"; credit for the data
#     "Amazon.com", for the dataset the six names below; GLB (glTF 2.0) files with +Y up, +Z pointing to the
#     natural front of the product "wherever applicable", standing products on Y = 0, wall-hung products with their
#     back on Z = 0.
#   Two GLBs downloaded and imported with Blender 5.2's glTF importer (B07B4SCB6T queen bed 3.3 MB, B075X4N3QJ arm
#     chair 4.0 MB): one mesh, one metallic-roughness material, base colour, metallic-roughness and normal maps
#     embedded in the GLB (PNG/JPEG, 2048 px); the importer's Z-up box is (extent_x, extent_z, extent_y) of the csv
#     (the bed: 1.71 x 2.37 x 1.44 m) and the bed's headboard lies at +Y, so the product front is -Y.
dataset:
  name: Amazon Berkeley Objects
  base_url: https://amazon-berkeley-objects.s3.amazonaws.com
  index_url: https://amazon-berkeley-objects.s3.amazonaws.com/index.html
  csv: 3dmodels/metadata/3dmodels.csv.gz
  listings: listings/metadata/listings_{shard}.json.gz
  shards: "0123456789abcdef"
  readme: 3dmodels/README.md
  glb: 3dmodels/original/{path}
  licence: CC-BY-4.0
  licence_url: https://creativecommons.org/licenses/by/4.0/
  credit_data: Amazon.com
  credit_dataset: "Matthieu Guillaumin, Thomas Dideriksen, Kenan Deng, Himanshu Arora (Amazon.com), Jasmine Collins
    and Jitendra Malik (UC Berkeley)"
  via: Amazon Berkeley Objects (CC BY 4.0)
  # README convention 2: glTF +Z is the product's natural front = -Y in the Z-up frame of Blender's glTF importer.
  # It is the documented front of every ABO model (the judges must not contradict it, objaverse.decide).
  front_axis: "-Y"
  # The credit line of docs/milestone8.md §2, plus the changes CC BY 4.0 §3(a)(1)(B) asks for (as the Objaverse
  # line of docs/milestone7.md §7.3).
  attribution: '"{title}" by Amazon.com, Amazon Berkeley Objects (CC BY 4.0), {index_url}'
  changes: scaled to the drawn footprint, re-oriented, rendered, AI-retouched

# Survey limits (docs/milestone8.md §2).
survey:
  per_type_limit: 40          # <= 40 candidates per type (docs/milestone9.md §2.1; M8: 24). The pick order does not
                              # depend on the limit, so the first 24 of every type are the M8 candidates
  max_downloads_per_type: 60  # downloads tried in pick order until per_type_limit pass the file checks (M8: 36)
  max_glb_mb: 60              # larger GLBs are refused (glb_size)
  workers: 8                  # parallel GLB downloads
  # Pick order inside a type: round robin over the listing's English `style` values (casefolded; no value is a
  # group of its own), groups in order of size (largest first, then by name); inside a group the colour variants of
  # one product (same brand and item name without its last comma-separated part, e.g. "..., Spinnsol Cocoa") come
  # after the other products, then the larger texture first (image_width_max x image_height_max), then the id.
  english_tags: [en_US, en_GB, en_IN, en_AU, en_CA, en_SG, en_AE]   # item_name / style / colour: first of these,
                                                                    # then any en_*; no English name -> any name

# Milestone 10 (8 Oct 2026): the same 7,953 models and 7,960 listings with a 3D model re-read in the session (98 product
# types; the sha256 of the 18 metadata files and the counts per type are in results/library/survey_m10_session.json).
# Real GLBs checked in the session (Blender 5.2.2): every ABO model has ONE material slot (a texture atlas), so the
# material slots of wenart/assets/recolour.py ask which materials that one slot holds.
#
# Mapping (docs/milestone8.md §2): the first rule that matches decides. A rule matches a listing when its product
# type is in `product_types`, its English item_name holds one of `words` (when the rule has words: whole words,
# case-insensitive, a plural s / es allowed), none of `not_words`, and the model's height (csv extent_y, metres) is
# at least `min_height` (and, Milestone 9, at most `max_height`). `types`: the first type whose size range holds the model's box (wenart/recognition/
# size_table.yaml footprint + 15 %, objaverse.yaml height range; decor: objaverse.yaml decor_sizes); none holds it ->
# refused size_range (named after the first type). `bed` = bed_single / bed_double by the width (the shorter footprint
# side) at objaverse.yaml bed_split_width_m. Listings without an English item_name match only rules without words.
# Counts on the real metadata (4 Oct 2026, `python -m wenart.assets.abo survey --metadata DIR --no-download`;
# mapped / in the size range, i.e. candidates before the 24 cap): sofa 962/748, armchair 580/560, chair 430/367,
# bed_double 161/144, bed_single 27/12, table_coffee 152/143, side_table 136/121, desk 146/101, floor_lamp 101/76,
# nightstand 82/76, tv_unit 68/57, dresser 53/46, table_dining 54/46, bookshelf 48/41, wardrobe 21/16; decor: rug
# 861/861, wall_art 639/633, cushion 195/195, plant 189/142 (436 candidates; 536 models refused size_range; 483 models
# without an English item name). No sanitary ware or kitchen appliances in ABO: those stay Objaverse/parametric.
# Milestone 10 types the ABO listings hold no model of (read 8 Oct 2026, 7,960 listings with a 3D model): no rule, the
# reason is in the session summary (abo survey --summary) and the coverage table of docs/milestone10.md §4.11.
no_listing:
  crib: "no baby bed: no item name holds crib, cot, cradle or bassinet (one MATTRESS is a rollaway guest bed, 'Cot size')"
  curtain: "no curtain or drape in any item name; the product type CURTAIN holds 17 wall-art canvases"
  blind: "no window blind or shade in any item name"
  throw: "no throw blanket: BLANKET is one blanket ladder; 'throw' names 204 throw pillows (cushion)"
  books: "no book or book stack in any item name"
  # Parametric by design, not for lack of listings (docs/milestone10.md §4.4, review finding 41).
  wall_cabinet: "no library source: wall cabinets are built parametrically along the counter run with its fronts, colour
    and handle (docs/milestone10.md §4.4); the ABO holds three wall-hung cabinets (a Stone & Beam wall organizer and
    the Movian bathroom cabinets), which no rule takes"

# What the few listings of a Milestone 10 type are (session summary, same date).
type_notes:
  bunk_bed: "one floor bunk bed (Max & Finn); the two metal loft beds are no bunk beds"
  chaise: "six chaise lounges (Ravenna Home tufted, Stone & Beam Varon daybed chaise); the sofa chaises are corner sofas"
  display_cabinet: "one display cabinet (Alkove Malvern); the display cases are flag cases"
  tall_cabinet: "17 in range; most CABINET listings of this kind have no English name, only the height rule takes them"
  sculpture: "one figurine; the SCULPTURE listing is a planter set"
  plant_large: "no tall plant: the tallest PLANTER is a hanging planter, ARTIFICIAL_PLANT is one hanging planter"
  tray: "four serving trays"
  candle: "four candle holders and two candle lanterns"
  basket: "mostly sets of two or three baskets (the judges decide whether a set is one object)"
  clock: "eight CLOCK listings and three named clocks, all wall clocks"

rules:
  - {name: bed, product_types: [BED, BED_FRAME],
     not_words: [loft, bunk, air mattress, airbed, inflatable, daybed, trundle, toddler], types: [bed]}
  # ---- Milestone 10 (docs/milestone10.md §4.5, §4.6). The product types and words below were read from the listings
  # on 8 Oct 2026 (results/library/survey_m10_session.json holds the counts). Listings in the 8 Oct 2026 files: no
  # crib, no curtain or blind (the product type CURTAIN holds 17 wall-art canvases), no throw blanket (BLANKET is one
  # blanket ladder; "throw" names throw pillows), no book, and no large floor plant (the tallest PLANTER is a hanging
  # planter): those types get no ABO rule; Objaverse and the generated models fill them.
  - {name: bunk_bed, since: m10, product_types: [BED, BED_FRAME, FURNITURE, HOME_FURNITURE_AND_DECOR], words: [bunk, bunk bed],
     types: [bunk_bed]}
  - {name: sofa_corner, since: m10, product_types: [SOFA],
     words: [sectional, corner, l-shaped, l shaped, l-shape, l shape, chaise],
     not_words: [slipcover, cover, outdoor, patio, aluminum, wicker, rattan, ottoman, pillow, module, component],
     types: [sofa_corner, sofa]}
  - {name: sofa_corner_named, since: m10, product_types: [CHAIR, HOME_FURNITURE_AND_DECOR, FURNITURE, HOME],
     words: [sectional, corner, l-shaped, l shaped, l-shape, l shape, sofa chaise],
     not_words: [slipcover, cover, outdoor, patio, aluminum, wicker, rattan, ottoman, pillow, chair, armchair, loveseat,
                 bench, desk, table, bed, shelf, cabinet, module, component],
     types: [sofa_corner]}
  - {name: sofa, product_types: [SOFA], types: [sofa]}
  - {name: sofa_named, product_types: [CHAIR, HOME_FURNITURE_AND_DECOR, FURNITURE, HOME],
     words: [sofa, couch, loveseat, settee], not_words: [slipcover, cover, ottoman, table, bed, pillow], types: [sofa]}
  - {name: chaise, since: m10, product_types: [CHAIR, SOFA, HOME_FURNITURE_AND_DECOR, FURNITURE],
     words: [chaise lounge, chaise lounger, chaise longue, daybed chaise, chaise],
     not_words: [sofa, sectional, couch, corner, l-shaped, reversible, outdoor, patio, pool, wicker, zero gravity,
                 folding, ottoman],
     types: [chaise]}
  - {name: office_chair, since: m10, product_types: [CHAIR],
     words: [office, gaming, task, computer, executive, ergonomic, desk chair],
     not_words: [outdoor, patio, folding, stool, kids, kid, children, toy], types: [office_chair]}
  - {name: office_chair_named, since: m10, product_types: [HOME_FURNITURE_AND_DECOR, FURNITURE],
     words: [office chair, desk chair, task chair, gaming chair, computer chair, executive chair, ergonomic chair],
     not_words: [table, workstation, outdoor, patio, folding, stool, kids, kid, children, toy],
     types: [office_chair]}
  - {name: bar_stool, since: m10, product_types: [STOOL_SEATING],
     not_words: [drafting, wheels, step, ladder, vanity, makeup, ottoman, pouf, footrest stool], types: [bar_stool]}
  - {name: bar_stool_named, since: m10, product_types: [CHAIR, HOME_FURNITURE_AND_DECOR, FURNITURE],
     words: [bar stool, barstool, counter stool, bar height, counter height],
     not_words: [office, gaming, task, computer, executive, desk, outdoor, patio, folding, drafting], types: [bar_stool]}
  - {name: shoe_cabinet, since: m10, product_types: [CABINET, CLOTHES_RACK, BENCH, STORAGE_BOX, STORAGE_RACK, SHELF, FURNITURE,
                                          HOME_FURNITURE_AND_DECOR, HOME],
     words: [shoe, shoes], not_words: [mat, mats, box, boxes, polish, brush, horn], types: [shoe_cabinet]}
  - {name: bench, since: m10, product_types: [BENCH],
     not_words: [fitness, workout, weight, exercise, piano, keyboard, cushion], types: [bench]}
  - {name: bench_named, since: m10, product_types: [OTTOMAN, SOFA, HOME_FURNITURE_AND_DECOR, FURNITURE],
     words: [bench], not_words: [sofa, loveseat, couch, settee, pillow, cushion, cover, workout, fitness, weight, desk,
                                 table],
     types: [bench]}
  - {name: ottoman, since: m10, product_types: [OTTOMAN],
     not_words: [bench, cover, slipcover, chair, sofa, sectional], types: [ottoman]}
  - {name: ottoman_named, since: m10, product_types: [CHAIR, HOME_FURNITURE_AND_DECOR, FURNITURE, HOME],
     words: [ottoman, pouf, pouffe, footstool, foot stool, hassock],
     not_words: [chair, sofa, armchair, cover, slipcover, bench, bed, sectional, tray table, desk], types: [ottoman]}
  - {name: armchair, product_types: [CHAIR],
     words: [armchair, arm chair, arm, accent, lounge, club, wingback, recliner],
     not_words: [armless, office, gaming, task, computer, executive, desk, dining, outdoor, patio, folding, sectional],
     types: [armchair, chair]}
  - {name: chair, product_types: [CHAIR],
     not_words: [office, gaming, task, computer, executive, desk, outdoor, patio, folding, sectional],
     types: [chair, armchair]}
  - {name: table_coffee, product_types: [TABLE, HOME_FURNITURE_AND_DECOR, FURNITURE], words: [coffee],
     types: [table_coffee]}
  - {name: nightstand, product_types: [TABLE, CABINET, DRESSER, HOME_FURNITURE_AND_DECOR, FURNITURE],
     words: [nightstand, night stand, bedside, night table], types: [nightstand]}
  - {name: tv_unit, product_types: [CABINET, TABLE, SHELF, HOME_FURNITURE_AND_DECOR, FURNITURE], words: [tv, media],
     types: [tv_unit]}
  - {name: console_table, since: m10, product_types: [TABLE, HOME_FURNITURE_AND_DECOR, FURNITURE, DESK, SHELF, CABINET],
     words: [console, sofa table, entryway, hall table, entry table, hallway],
     not_words: [tv, media, entertainment, bar, coffee, gaming, game, video], types: [console_table]}
  - {name: side_table, product_types: [TABLE], words: [side, end, accent], types: [side_table]}
  - {name: table_dining, product_types: [TABLE], words: [dining, kitchen table], types: [table_dining]}
  - {name: desk, product_types: [DESK], types: [desk]}
  - {name: desk_named, product_types: [TABLE], words: [desk, writing table], types: [desk]}
  - {name: wardrobe, product_types: [CABINET, HOME_FURNITURE_AND_DECOR, FURNITURE], words: [wardrobe, armoire],
     types: [wardrobe]}
  - {name: dresser, product_types: [DRESSER], types: [dresser, nightstand]}
  - {name: dresser_named, product_types: [CABINET, HOME_FURNITURE_AND_DECOR, FURNITURE],
     words: [chest of drawers, dresser], types: [dresser, nightstand]}
  # Milestone 10 cabinets. After the wardrobe, dresser and TV rules; many CABINET listings have no English name and
  # match only rules without words (tall_cabinet: a CABINET at least 1.4 m high).
  - {name: sideboard, since: m10, product_types: [CABINET, TABLE, HOME_FURNITURE_AND_DECOR, FURNITURE, SHELF],
     words: [sideboard, buffet, credenza], not_words: [lamp, tv, media, island, cart], types: [sideboard]}
  - {name: display_cabinet, since: m10, product_types: [CABINET, SHELF, HOME_FURNITURE_AND_DECOR, FURNITURE],
     words: [display, curio, china, vitrine, glass door, glass doors, hutch],
     not_words: [flag, case, stand, wall mounted, wall mount, wall-mounted, wall-mount, floating],
     types: [display_cabinet]}
  # No wall_cabinet rule: wall cabinets are parametric (docs/milestone10.md §4.4); the cabinet rules below keep their
  # "wall mounted" not_words, so a wall-hung cabinet does not become a sideboard, display or tall cabinet.
  - {name: tall_cabinet, since: m10, product_types: [CABINET], min_height: 1.4,
     not_words: [wardrobe, armoire, bed, bunk, tv, media, desk, wall mounted, wall mount, wall-mounted, wall-mount,
                 wall hung, wall-hung, hanging, floating, closet],
     types: [tall_cabinet]}
  - {name: bookshelf, product_types: [SHELF], not_words: [floating, wall], min_height: 1.0, types: [bookshelf]}
  - {name: bookshelf_named, product_types: [HOME_FURNITURE_AND_DECOR, FURNITURE],
     words: [bookcase, bookshelf, shelving unit], min_height: 1.0, types: [bookshelf]}
  - {name: floor_lamp, product_types: [LAMP], min_height: 1.2, types: [floor_lamp]}
  # Milestone 9 decor (docs/milestone9.md §2.1): table lamps, vases, wall mirrors. The vase rules come before the
  # planter rules (a PLANTER listing named "... Vase" is a vase).
  - {name: table_lamp, product_types: [LAMP], max_height: 0.95,
     not_words: [floor, standing, torchiere, clamp, clip, wall, ceiling, pendant], types: [table_lamp]}
  - {name: vase, product_types: [VASE], not_words: [wall mount, hanging], types: [vase]}
  - {name: vase_named, product_types: [PLANTER, HOME, HOME_FURNITURE_AND_DECOR], words: [vase],
     not_words: [wall mount, hanging, planter], types: [vase]}
  - {name: mirror, product_types: [HOME_MIRROR],
     not_words: [floor, standing, full length, leaner, storage, jewelry, cabinet, vanity], types: [mirror]}
  - {name: mirror_named, product_types: [HOME, HOME_FURNITURE_AND_DECOR], words: [mirror],
     not_words: [floor, standing, full length, leaner, storage, jewelry, cabinet, vanity], types: [mirror]}
  # Milestone 10 decor (docs/milestone10.md §4.6): candles and holders, baskets, trays, wall clocks, figurines,
  # tall planters with a plant, pendant and ceiling lights. A candle-holder listing that is a hanging light
  # ("Raffia Ceiling Hanging Pendant Chandelier") is a pendant light.
  - {name: pendant_light, since: m10, product_types: [LIGHT_FIXTURE, HOME_LIGHTING_AND_LAMPS, CANDLE_HOLDER],
     words: [pendant, chandelier, hanging, cage],
     not_words: [wall, sconce, vanity, outdoor, fan, flush, semi flush, semi-flush, recessed], types: [pendant_light]}
  - {name: ceiling_light, since: m10, product_types: [LIGHT_FIXTURE, HOME_LIGHTING_AND_LAMPS],
     words: [ceiling, flush, semi flush, semi-flush, close to ceiling],
     not_words: [pendant, chandelier, sconce, wall, vanity, outdoor, fan, hanging, recessed], types: [ceiling_light]}
  - {name: candle, since: m10, product_types: [CANDLE_HOLDER],
     not_words: [pendant, chandelier, ceiling, shade, light fixture, led, wall, hanging, lamp, sconce],
     types: [candle]}
  - {name: candle_named, since: m10, product_types: [HOME, HOME_FURNITURE_AND_DECOR], words: [candle, candles, lantern],
     not_words: [pendant, chandelier, ceiling, shade, light fixture, led, wall, hanging, lamp, sconce, scent, scented],
     types: [candle]}
  - {name: basket, since: m10, product_types: [BASKET, STORAGE_BOX], words: [basket, baskets],
     not_words: [waste, trash, side table, ladder, drawer], types: [basket]}
  - {name: basket_named, since: m10, product_types: [HOME, HOME_FURNITURE_AND_DECOR], words: [basket, baskets],
     not_words: [waste, trash, side table, ladder, drawer, hamper], types: [basket]}
  - {name: tray, since: m10, product_types: [HOME, HOME_FURNITURE_AND_DECOR], words: [tray, trays],
     not_words: [ottoman, folding, table, dinner, drawer, organizer], types: [tray]}
  - {name: clock, since: m10, product_types: [CLOCK], not_words: [alarm, grandfather, floor, table clock], types: [clock]}
  - {name: clock_named, since: m10, product_types: [HOME, HOME_FURNITURE_AND_DECOR], words: [clock],
     not_words: [alarm, grandfather, floor, table clock, lamp], types: [clock]}
  - {name: sculpture, since: m10, product_types: [SCULPTURE, FIGURINE], not_words: [planter, planters, wall, pot],
     types: [sculpture]}
  - {name: sculpture_named, since: m10, product_types: [HOME, HOME_FURNITURE_AND_DECOR], words: [sculpture, statue, figurine, bust],
     not_words: [wall art, print, wall, planter, lamp, mirror], types: [sculpture]}
  - {name: plant_large, since: m10, product_types: [PLANTER, ARTIFICIAL_PLANT], min_height: 0.9,
     not_words: [hanging, wall, mount], types: [plant_large]}
  # decor (kind decor; docs/milestone8.md §4)
  - {name: rug, product_types: [RUG], types: [rug]}
  - {name: rug_named, product_types: [HOME_FURNITURE_AND_DECOR, FURNITURE, HOME], words: [rug], types: [rug]}
  - {name: wall_art, product_types: [WALL_ART], types: [wall_art]}
  - {name: wall_art_named, product_types: [HOME, HOME_FURNITURE_AND_DECOR], words: [wall art, print, mural],
     not_words: [mirror, pillow], types: [wall_art]}
  - {name: cushion, product_types: [PILLOW], not_words: [patio, outdoor, sofa], types: [cushion]}
  - {name: cushion_named, product_types: [HOME], words: [pillow], not_words: [sofa, bed], types: [cushion]}
  - {name: plant, product_types: [PLANTER], types: [plant]}
  - {name: plant_named, product_types: [HOME, HOME_FURNITURE_AND_DECOR], words: [planter], types: [plant]}
