# Functional furniture groups (docs/milestone12.md §4.2-§4.6, §4.9; owner: track G).
#
# What: the groups a room's program asks for (wenart/furniture/program.py), the solver places
# (wenart/furniture/solver.py) and the group checks judge (wenart/furniture/group_checks.py): the anchor, the partners
# in the anchor's frame, what each piece faces, the use zones (where a person stands or sits), the wall rules, the
# size variants by room size, the soft-score weights and every number with its source. One file for the solver, the
# checks, the agent's tools and the tests; `groups.load_groups()` reads and validates it.
#
# Why: Milestone 11 had five hard-coded templates that no stage used (§1.2); the layout and the completion placed
# single pieces with raw coordinates and the checks only counted partners.
#
# Frames: the anchor frame is the block frame of wenart/furniture/schemas.py: x along the front edge (+x = the right
# of a person facing the piece), the front towards -y, the back edge at +depth/2. Sizes are [width along the front,
# depth] in metres.
#
# Rules: `min` is a hard check (the solver never places below it, the group checks report it), `rec` (recommended)
# only scores, so small Turkish rooms still get a layout. `flagged: true` = a number from a secondary source or our
# own assumption (listed in the report); the brief may change them later.
#
# Format idea only: ProcTHOR's asset groups (allenai/procthor, Apache-2.0: an anchor with relative children). Constraint
# words after Holodeck (allenai/Holodeck, Apache-2.0: edge, in front of, side of, face to), the hard/soft split after
# Infinigen Indoors (princeton-vl/infinigen, BSD-3), the score-term names after Merrell et al. 2011 and Yu et al. 2011
# ("Make It Home"). No code or data of these projects is copied.

version: 1

sources:
  nkba_kitchen: "NKBA Kitchen Planning Guidelines (media.nkba.org/uploads/2022/05/Kitchen-Planning-Guidelines.pdf), snippet; the 5th edition (2024) not read here"
  nkba_bath: "NKBA Bath Planning Guidelines (media.nkba.org/uploads/2022/05/Bath-Planning-Guidelines.pdf), snippet"
  adm_m4: "UK Approved Document M vol. 1, M4(2) accessible and adaptable dwellings, snippet"
  din18011_blog: "a blog quoting the withdrawn DIN 18011 (flagged)"
  panero_blog: "a blog quoting Panero & Zelnik, Human Dimension & Interior Space (flagged)"
  viewing: "SMPTE/THX viewing angles via secondary sources (flagged)"
  ours: "our assumption for small flats (flagged); no Turkish furniture-clearance standard was found"
  # Milestone 13 (docs/milestone13.md §2.4, research of 12 Oct 2026): the designer terms R3, R6, R12-R14. None of
  # the books could be read; the numbers come from guides that cite them, so every term is flagged.
  design_books: "design guides citing Neufert, Panero & Zelnik, Ching and Time-Saver Standards (ArchDaily 'How to arrange furniture in architectural spaces', Houzz, retailer rug guides; secondary, flagged)"
  merrell2011: "Merrell et al. 2011, 'Interactive furniture layout using interior design guidelines' (the alignment and balance term names; secondary, flagged)"
  turkish_imar: "Planlı Alanlar İmar Yönetmeliği minimum room sizes (living 12 m² / 3.00 m, bedroom 9 m² / 2.50 m, kitchen 3.30 m² / 1.50 m; mevzuat.gov.tr not reachable, search snippets of mimarim.com and Lexpera; flagged)"

# name: {min (hard), rec (score), max, ...; source: [keys of sources]; flagged}. Metres and degrees.
rules:
  walkway_main: {min: 0.80, rec: 0.91, source: [ours, nkba_kitchen], flagged: true, what: "main walkway from the entrance door to the other doors"}
  walkway: {min: 0.60, rec: 0.75, source: [ours], flagged: true, what: "walkway between doors and to every use zone"}
  kitchen_aisle: {min: 0.90, rec: 1.07, source: [ours, nkba_kitchen], flagged: true, what: "work aisle in front of a counter run (NKBA 1.07 for one cook; 0.90 our minimum for small flats)"}
  sink_landing: {min: 0.46, rec: 0.61, source: [nkba_kitchen], what: "counter beside the sink, one side (rec 0.61 + 0.46)"}
  hob_landing: {min: 0.30, rec: 0.38, source: [nkba_kitchen], what: "counter beside the hob, one side (rec 0.30 + 0.38)"}
  fridge_landing: {min: 0.38, across_max: 1.22, side_gap: 0.10, source: [nkba_kitchen], what: "counter beside the fridge on its handle side, or a counter or island at most 1.22 m across from it; a counter run that turns the corner beside the fridge (within 0.10 m of its side) counts as beside"}
  triangle_leg: {min: 1.20, max: 2.70, source: [nkba_kitchen], what: "each leg of the work triangle fridge - sink - hob"}
  triangle_sum: {max: 7.90, source: [nkba_kitchen], what: "the three legs together"}
  diner_pullout: {min: 0.81, rec: 0.91, rec_walk: 1.12, source: [nkba_kitchen], what: "table edge to a wall or piece behind a seated diner"}
  fixture_front: {min: 0.53, rec: 0.76, source: [nkba_bath], what: "clear floor in front of a toilet, washbasin, shower or bathtub"}
  toilet_side: {min: 0.38, rec: 0.46, source: [nkba_bath], what: "toilet centre to a side wall or fixture"}
  washbasin_side: {min: 0.38, rec: 0.51, source: [nkba_bath], what: "washbasin centre to a side wall"}
  bed_side: {min: 0.60, rec: 0.75, source: [din18011_blog, adm_m4], flagged: true, what: "free along each free long side and at the foot of a bed"}
  coffee_gap: {min: 0.30, rec: 0.35, rec_max: 0.45, source: [panero_blog], flagged: true, what: "sofa front to the coffee table"}
  tv_distance: {min: 1.50, rec_factor: [1.2, 1.6], screen_diagonal: 1.40, source: [viewing], flagged: true, what: "sofa front to the TV unit front (rec 1.2-1.6 x the screen diagonal, 55 inch assumed)"}
  tv_axis: {max_offset: 0.30, max_angle: 10.0, source: [ours], what: "TV unit centre off the sofa axis, TV front off the line to the sofa"}
  armchair_facing: {max_angle: 30.0, max_distance: 2.50, source: [ours], what: "an armchair faces the coffee table or the sofa"}
  nightstand_gap: {max: 0.30, rec: 0.05, source: [ours], what: "nightstand to the bed side and to the headboard line (further away it no longer reads as the bed's)"}
  storage_front: {min: 0.80, source: [ours], flagged: true, what: "free in front of wardrobes and other door-fronted storage"}
  desk_back: {min: 0.80, source: [ours], flagged: true, what: "free behind the desk front (the chair zone)"}
  window_band: {depth: 0.30, sill_margin: 0.05, source: [ours], what: "nothing taller than the sill + 0.05 m within 0.30 m in front of a window"}
  # Milestone 13 (T3): the designer terms of docs/milestone13.md §2.4 as data (scored, never hard).
  conversation_circle: {min: 2.4, max: 3.0, facing_deg: 45.0, source: [design_books], flagged: true, what: "R3: a seating group is a conversation circle 2.4-3.0 m across (seat front to seat front); every seat faces the group's centre within 45 degrees"}
  rug_seating: {inset: 0.30, min_side: 1.20, source: [design_books], flagged: true, what: "R6: the rug under a seating group covers the group's box (sofa front, coffee table, armchairs) with the front legs of every seat on it: 0.30 m under each seat front, centred on the group"}
  rug_dining: {margin: 0.60, source: [design_books], flagged: true, what: "R6: a dining rug reaches 0.60 m past the table edge on every side so pulled chairs stay on it (used by the decor rules)"}
  rug_bed: {width: 0.80, source: [design_books], flagged: true, what: "R6: a runner 0.80 m wide along each free long side of a bed, from the nightstand line to the foot (a bedroom-rug overhang was not found in a readable source)"}
  floating: {max_m: 0.80, source: [ours], flagged: true, what: "R12: nothing floats: a free-standing piece counts as anchored when a wall, its group's anchor or another piece stands within 0.80 m of it"}
  alignment: {axis_deg: 5.0, pair_m: 0.10, source: [merrell2011], flagged: true, what: "R13: a free anchor parallel to the room's main axis (or a wall) within 5 degrees; a pair (nightstands, armchairs) mirrored about the anchor's axis within 0.10 m; wall pieces centred on their span (wall_use)"}

# Soft score terms of the solver (names after Merrell et al. 2011 and Yu et al. 2011); each term is 0..1 (higher is
# better), the candidate score is the weighted sum; every candidate logs its terms.
weights:
  wall_use: 1.0          # a wall anchor centred on its free wall span (or in a corner where the anchor asks for it)
  sight_tv: 3.0          # sofa -> TV: on the axis and at the recommended viewing distance
  bed_sees_door: 1.5     # the door lies in front of the headboard line, not straight behind the foot
  desk_side_light: 1.0   # a window beside the desk, not behind it
  daylight: 1.0          # dining table and desk near a window
  circulation: 2.0       # the walkways between doors stay short (vs the room without the new pieces)
  seating_crossed: 2.0   # no walkway through the seating area (between the sofa and the TV)
  related_near: 1.0      # dining near the kitchen (zone or door)
  balance: 1.0           # the furniture's centre near the room's centre
  drawn_distance: 1.0    # partners of a drawn anchor at their template place; a re-layout near the old places
  recommended: 2.0       # share of the recommended clearances (not only the minimums) kept
  partners: 1.5          # optional partners placed
  sink_window: 0.5       # the sink under a window
  # Milestone 13 (T3): the designer terms (rules conversation_circle, rug_*, floating, alignment above).
  conversation: 1.0      # R3: the seats of a seating group form a 2.4-3.0 m conversation circle and face its centre
  rug: 0.5               # R6: the group's rug member is placed (seating: under the coffee table; sleeping: beside the bed)
  anchored: 1.0          # R12: every new piece stands on a wall or within 0.80 m of its group or another piece
  alignment: 0.5         # R13: free anchors parallel to the room's axes, pairs mirrored about the anchor's axis

# Milestone 13 (T3, R14 of docs/milestone13.md §2.4): room-size variants below the legal minimum areas (turkish_imar
# + our arithmetic: a 2.50 m bedroom leaves 0.45 m beside a 1.60 m bed; a 3.00 m living room holds no armchair).
small_rooms:
  living: {max_area: 12.0, options: [sofa], source: [turkish_imar, ours], flagged: true, what: "a living room under 12 m²: a sofa without armchairs (the seating options narrow to 'sofa')"}
  bedroom: {max_area: 10.0, sides_needed: 1, source: [turkish_imar, design_books, ours], flagged: true, what: "a bedroom under 10 m²: one long side of a double bed may stand on the wall (0.46 m absolute minimum on the other side per the design guides; the other side keeps bed_side)"}

# Milestone 13 (T3): tiered minimums. A tier names the rules it changes for a room class: ``min`` replaces the
# rule's minimum, ``hard: false`` turns the minimum into a scored term (the solver no longer refuses a place for it,
# the group checks report it as minor). ``room_types`` / ``max_area`` select the tier by the room (``drawn_run``
# applies when the kitchen run is drawn fixed equipment: its sink and hob cannot move, so the NKBA work triangle
# and the fridge landing of an added fridge are scored, never a reason to leave the kitchen without a fridge).
tiers:
  small_kitchen: {room_types: [kitchen], max_area: 7.0, rules: {kitchen_aisle: {min: 0.90, hard: false}, walkway_main: {min: 0.60}, walkway: {min: 0.60}}, source: [ours, nkba_kitchen, turkish_imar], flagged: true, what: "a kitchen under 7 m² (the legal minimum is 3.30 m²): the 0.90 m aisle is a soft term (the NKBA 1.07 m recommended stays soft), the main walkway 0.60 m"}
  drawn_run: {drawn_run: true, room_types: [kitchen], max_area: 14.0, rules: {triangle_leg: {hard: false}, triangle_sum: {hard: false}, fridge_landing: {hard: false}}, source: [ours], flagged: true, what: "a drawn counter run in a kitchen under 14 m² (real04: 13.6 m², 4 of 4 kitchens without a fridge) fixes the sink and the hob: the work triangle and the fridge landing of an added fridge are soft terms (scored, reported as minor); a larger kitchen keeps the NKBA minimums hard"}
  # 26 Oct 2026 (user: "a kitchen must never be empty"): a compact fallback run (kitchen_run options with fallback:
  # true) has 0.30 m base units between its appliances and no room for 1.20 m triangle legs: the NKBA landings and the
  # work triangle are soft terms there (scored, reported as minor). Only for such a run (compact_run flag).
  compact_run: {compact_run: true, rules: {sink_landing: {hard: false}, hob_landing: {hard: false}, fridge_landing: {hard: false}, triangle_leg: {hard: false}, triangle_sum: {hard: false}}, source: [ours, nkba_kitchen], flagged: true, what: "a compact kitchen run (the solver's fallback when no full run fits): the landings and the work triangle are scored, a kitchen is never left empty"}

# Milestone 13 (T3): room-type aliases. The ingest types rooms from their labels (wenart/building.py); rooms it
# leaves ``other`` or ``unknown`` are read here by the words of their label (Turkish keywords match at the start of
# a word, English ones as whole words; letters folded to ASCII) and, failing that, by their drawn anchors
# (``content``). The kinds are the room types the templates know. ``min_area`` guards a generic word (a 0.3 m² "Oda"
# is a shaft, not a bedroom). Labels of real02/real03/real04 that failed: "Oyun Aktivite Ve Dinlenme Odası" (other,
# two drawn sofas), "Oda" (other / unknown), "Merdiven" (a stair landing typed hall).
room_aliases:
  living: {words: [salon, oturma, yasama, oyun, dinlenme, aktivite, misafir odasi, living, lounge, family, sitting, drawing, games, play], source: [ours], what: "a living room or lounge"}
  bedroom: {words: [yatak, ebeveyn, cocuk, misafir, oda, bedroom, master, guest, nursery, kids, children], min_area: 7.0, source: [ours, turkish_imar], what: "a bedroom (a plain 'Oda' of at least 7 m² in a dwelling)"}
  kitchen: {words: [mutfak, kitchen, kitchenette], source: [ours], what: "a kitchen"}
  dining: {words: [yemek, dining], source: [ours], what: "a dining room"}
  bathroom: {words: [banyo, dus, bath, shower], source: [ours], what: "a bathroom"}
  wc: {words: [wc, tuvalet, lavabo, toilet, powder], source: [ours], what: "a toilet"}
  hall: {words: [antre, hol, koridor, giris, ruzgarlik, sahanlik, merdiven, hall, hallway, corridor, lobby, foyer, entrance, landing, passage], source: [ours], what: "a hall, corridor or landing"}
  other: {words: [calisma, ofis, camasir, study, office, utility, laundry], source: [ours], what: "a study or utility room (the work group)"}
  balcony: {words: [balkon, teras, balcony, terrace, veranda, deck], source: [ours], what: "a balcony or terrace"}
  content: {sofa: living, sofa_corner: living, bed_double: bedroom, bed_single: bedroom, bunk_bed: bedroom, crib: bedroom, kitchen_counter: kitchen, toilet: bathroom, bathtub: bathroom, shower: bathroom, table_dining: dining, desk: other}
  stair_cover: 0.60   # a hall whose drawn stair covers more than this share of its floor is a landing: no program
  # Review fix (15 Oct 2026): a generic word names a room only when no other kind's word is in the label (a "Çalışma
  # Odası" is a study, a "Çamaşır Odası" a utility room, not a bedroom).
  generic: [oda]

# Milestone 13 (T3): block-name words for ``infer.type_by_code`` (method ``block``): a word of a block name (folded to
# ASCII, lower case, matched at the start of a word) names a type; the footprint must fit the type's product range
# (size table, 40 % tolerance) or snap to a product. The names are the ones of the real02/03/04 drawings (YATAK,
# masa, koltuk, klozet, ebeveynlavabo, tekil_villa_evye, duşş, dolap01) and plain Turkish / English furniture words.
block_words:
  bed_double: [yatak, bed, cift kisilik]
  bed_single: [yatak, tek kisilik, single bed]   # YATAK names both bed types: the size decides (a 0.9 m YATAK is single)
  table_dining: [masa, yemek masasi, dining table, table]
  table_coffee: [sehpa, orta sehpa, coffee table]
  sofa: [koltuk, kanepe, sofa, couch]
  armchair: [berjer, tekli koltuk, armchair]
  chair: [sandalye, chair]
  wardrobe: [dolap, gardrop, wardrobe, closet]
  nightstand: [komodin, nightstand, bedside]
  desk: [calisma masasi, desk]
  bookshelf: [kitaplik, bookshelf, shelf]
  tv_unit: [tv unitesi, tv, television]
  toilet: [klozet, tuvalet, toilet, wc]
  washbasin: [lavabo, washbasin, basin, sink]
  shower: [dus, shower]
  bathtub: [kuvet, bathtub, tub]
  sink_kitchen: [evye, kitchen sink]
  stove: [ocak, firin, stove, hob, cooker]
  fridge: [buzdolabi, fridge, refrigerator]
  washing_machine: [camasir makinesi, washing machine, washer]
  kitchen_island: [ada, island]

# Where a person stands or sits to use a piece (hard: free of other pieces and inside the room; G11: reached by a
# walkway). front / sides / foot: depth in metres or a rule name (its `min`; the score checks its `rec`).
use_zones:
  bed_double: {sides: bed_side, foot: bed_side, head_skip: 0.45, sides_needed: 2}
  bed_single: {sides: bed_side, foot: bed_side, head_skip: 0.45, sides_needed: 1}
  bunk_bed: {sides: bed_side, head_skip: 0.45, sides_needed: 1}
  crib: {front: walkway}
  wardrobe: {front: storage_front}
  tall_cabinet: {front: storage_front}
  display_cabinet: {front: storage_front}
  dresser: {front: storage_front}
  sideboard: {front: storage_front}
  desk: {front: desk_back}
  toilet: {front: fixture_front, side_half: toilet_side}
  washbasin: {front: fixture_front, side_half: washbasin_side}
  bathtub: {front: fixture_front}
  shower: {front: fixture_front}
  washing_machine: {front: fixture_front}
  sofa: {front: coffee_gap}
  sofa_corner: {front: coffee_gap}
  armchair: {front: coffee_gap}
  kitchen_counter: {front: kitchen_aisle}
  sink_kitchen: {front: kitchen_aisle}
  stove: {front: kitchen_aisle}
  fridge: {front: kitchen_aisle}
  kitchen_island: {front: kitchen_aisle, back: kitchen_aisle}
  shoe_cabinet: {front: walkway}
  console_table: {front: walkway}
  bookshelf: {front: walkway}
  table_dining: {chairs: diner_pullout}

# The groups. layout: anchored (an anchor and partners in its frame) | set (each member on a free wall, e.g. a
# bathroom) | run (a kitchen counter run). place of an anchor: wall (back on a wall) | free (0.10 m grid, turned to the
# room's axes). Partner places: facing_wall (on the wall the anchor faces, centred on its axis), front (in front of
# the anchor's front at `gap`), flank (beside `of`, turned to face it), beside_head (at the head on each side, backs
# on the anchor's back line), foot (at the front, e.g. a bench at a bed's foot), around (chairs around a table, by its
# length), chair (in front of a desk). sizes: [width, depth] per type, tried in order (room-size rows: the first row
# whose max_area is above the room or zone area). options: the program's choices (the VLM picks among candidates
# built from them).
groups:
  seating:
    what: "a sofa facing a TV unit on the opposite wall, a coffee table between them, armchairs facing the table"
    layout: anchored
    zone: living
    room_types: [living]
    priority: 20
    anchor:
      types: [sofa, sofa_corner]
      place: wall
      align: centre
      sizes:
        - {max_area: 14.0, sofa: [[1.6, 0.9], [2.2, 0.9]], sofa_corner: [[2.2, 1.5]]}
        - {max_area: 22.0, sofa: [[2.2, 0.9], [1.6, 0.9]], sofa_corner: [[2.6, 1.6], [2.2, 1.5]]}
        - {sofa: [[2.6, 0.95], [2.2, 0.9]], sofa_corner: [[3.0, 1.7], [2.6, 1.6]]}
    options:
      sofa_2_armchairs: {anchor: sofa, counts: {armchair: 2}}
      sofa_armchair: {anchor: sofa, counts: {armchair: 1}}
      sofa: {anchor: sofa, counts: {armchair: 0}}
      corner_sofa: {anchor: sofa_corner, counts: {armchair: 0}}
      # 23 Oct 2026 (user: "increase the group furniture options 10x (sofa set etc)"): extra options, offered by the
      # room's area (min_area / max_area, groups.extra_options); the code score picks among their candidates.
      sofa2_round_coffee: {anchor: sofa, min_area: 9, sizes: {sofa: [[1.6, 0.9]]}, counts: {armchair: 0}, partner_sizes: {coffee: [[0.8, 0.8], [0.7, 0.7]]}, what: "2-seat sofa, round coffee table"}
      sofa2_side_table: {anchor: sofa, min_area: 9, sizes: {sofa: [[1.6, 0.9]]}, counts: {armchair: 0, side_table: 1}, what: "2-seat sofa with an end table"}
      sofa2_pouf: {anchor: sofa, min_area: 9, sizes: {sofa: [[1.6, 0.9]]}, counts: {armchair: 0, table_coffee: 0, ottoman: 1}, what: "2-seat sofa, a pouf as the coffee table"}
      sofa2_armchair_lamp: {anchor: sofa, min_area: 12, sizes: {sofa: [[1.6, 0.9]]}, counts: {armchair: 1, floor_lamp: 1}, what: "2-seat sofa, one armchair, a floor lamp"}
      sofa2_2_armchairs_round: {anchor: sofa, min_area: 14, sizes: {sofa: [[1.6, 0.9]]}, counts: {armchair: 2}, partner_sizes: {coffee: [[0.9, 0.9], [0.8, 0.8]]}, what: "2-seat sofa, two armchairs, round coffee table"}
      sofa_compact_tv: {anchor: sofa, min_area: 9, max_area: 14, counts: {armchair: 0}, partner_sizes: {tv: [[1.2, 0.4], [1.0, 0.35]], coffee: [[0.8, 0.5], [0.7, 0.45]]}, what: "a sofa with a slim TV unit and a small coffee table"}
      sofa_armchair_compact: {anchor: sofa, min_area: 10, max_area: 16, sizes: {sofa: [[1.6, 0.9]]}, counts: {armchair: 1}, partner_sizes: {coffee: [[0.8, 0.5], [0.7, 0.5]]}, what: "a compact sofa set with one armchair"}
      sofa3_side_tables: {anchor: sofa, min_area: 14, sizes: {sofa: [[2.2, 0.9]]}, counts: {armchair: 0, side_table: 2}, what: "3-seat sofa with two end tables"}
      sofa3_armchair_side_table: {anchor: sofa, min_area: 14, sizes: {sofa: [[2.2, 0.9]]}, counts: {armchair: 1, side_table: 1}, what: "3-seat sofa, one armchair, an end table"}
      sofa3_2_armchairs_side_tables: {anchor: sofa, min_area: 18, sizes: {sofa: [[2.2, 0.9]]}, counts: {armchair: 2, side_table: 2}, what: "3-seat sofa set: two armchairs, two end tables"}
      sofa3_2_armchairs_lamp: {anchor: sofa, min_area: 16, sizes: {sofa: [[2.2, 0.9]]}, counts: {armchair: 2, floor_lamp: 1}, what: "3-seat sofa, two armchairs, a floor lamp"}
      sofa3_pouf_lamp: {anchor: sofa, min_area: 13, sizes: {sofa: [[2.2, 0.9]]}, counts: {armchair: 0, table_coffee: 0, ottoman: 1, floor_lamp: 1}, what: "3-seat sofa, a pouf, a floor lamp"}
      sofa3_round_coffee_plant: {anchor: sofa, min_area: 15, sizes: {sofa: [[2.2, 0.9]]}, counts: {armchair: 1, potted_plant: 1}, partner_sizes: {coffee: [[0.9, 0.9], [0.8, 0.8]]}, what: "3-seat sofa, one armchair, round coffee table, a plant"}
      sofa3_long_coffee: {anchor: sofa, min_area: 16, sizes: {sofa: [[2.2, 0.9]]}, counts: {armchair: 2}, partner_sizes: {coffee: [[1.4, 0.7], [1.3, 0.6]]}, what: "3-seat sofa, two armchairs, a long coffee table"}
      sofa3_wide_tv: {anchor: sofa, min_area: 16, sizes: {sofa: [[2.2, 0.9]]}, counts: {armchair: 1}, partner_sizes: {tv: [[2.0, 0.45], [1.8, 0.45]]}, what: "3-seat sofa, one armchair, a wide TV unit"}
      sofa3_lamp_plant: {anchor: sofa, min_area: 13, sizes: {sofa: [[2.2, 0.9]]}, counts: {armchair: 0, floor_lamp: 1, potted_plant: 1}, what: "3-seat sofa between a floor lamp and a plant"}
