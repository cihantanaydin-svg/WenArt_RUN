# Change-gate models (docs/milestone5.md §1.6, §4). Ids, revisions, allow
# patterns and licences live only here; scripts/pod_setup_polish.sh downloads
# exactly these and wenart/gate/models.py passes the same revision.
# tests/test_m5_config.py checks the revisions against §1.6.

models:
  depth:        # relative disparity (monocular depth check)
    repo: depth-anything/Depth-Anything-V2-Small-hf
    revision: 5426e4f0f36572d16453bbda7a8389317b1bef99
    licence: Apache-2.0
    allow_patterns: ["*.json", "*.safetensors"]
    size_gb: 0.10
  sam:          # SAM 2.1 masks from object boxes
    repo: facebook/sam2.1-hiera-large
    revision: 665f8e2ad61cf5f53d65644ff27c8ee525124610
    licence: Apache-2.0
    allow_patterns: ["*.json", "*.safetensors", "*.txt"]
    size_gb: 0.90
  dino:         # DINOv2 patch features
    repo: facebook/dinov2-base
    revision: f9e44c814b77203eaa57a6bdbbd535f21ede1415
    licence: Apache-2.0
    allow_patterns: ["*.json", "*.safetensors"]
    size_gb: 0.35

# Added-object detector (docs/milestone7.md §8.1): OWLv2, used by `python -m wenart.gate detect` and
# `detect-calibrate` (wenart/gate/detect.py, wenart.gate.models.Detector). Not a gate model: it is outside
# `models:` so the gate key, the gate's model list and the polish manifest's gate models stay depth/sam/dino.
# Files at this revision (HF API, 3 Oct 2026): config.json, preprocessor_config.json, tokenizer_config.json,
# special_tokens_map.json, added_tokens.json, vocab.json, merges.txt, model.safetensors (620 MB);
# pytorch_model.bin is left out by the allow patterns.
detect:
  repo: google/owlv2-base-patch16-ensemble
  revision: cfd3195ba4ea9592eec887ded089f4c08eff231d
  licence: Apache-2.0
  allow_patterns: ["*.json", "*.safetensors", "*.txt"]
  size_gb: 0.62
